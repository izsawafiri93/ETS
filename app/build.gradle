plugins {
    id 'com.android.application'
}

android {
    namespace 'com.etm.etsenerjitakip'
    compileSdk 35

    defaultConfig {
        applicationId 'com.etm.etsenerjitakip'
        minSdk 23
        targetSdk 35
        versionCode 27
        versionName '2.0.4'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}


dependencies {
    implementation 'androidx.core:core:1.13.1'
}
