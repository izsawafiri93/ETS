<script>
/* v1.0.23 feature overrides */
(function(){
  const DEFAULT_IND_LIMIT=20;
  const DEFAULT_CAP_LIMIT=15;
  APP.forecast=[];
  APP.forecastScanRunning=false;
  // Upgrade old installations: use the previous monthly values when available,
  // otherwise apply the requested 20% inductive and 15% capacitive defaults.
  if(!APP.settings.schemaVersion||APP.settings.schemaVersion<17){
    APP.settings.indLimit=Number(APP.settings.monthlyInd)||DEFAULT_IND_LIMIT;
    APP.settings.capLimit=Number(APP.settings.monthlyCap)||DEFAULT_CAP_LIMIT;
    APP.settings.monthlyInd=APP.settings.indLimit;
    APP.settings.monthlyCap=APP.settings.capLimit;
    APP.settings.forecastWarningRatio=80;
    APP.settings.whatsappPrompt=true;
    APP.settings.schemaVersion=17;
    saveSettings();
  }
  APP.settings.indLimit=Number(APP.settings.indLimit)||DEFAULT_IND_LIMIT;
  APP.settings.capLimit=Number(APP.settings.capLimit)||DEFAULT_CAP_LIMIT;
  APP.settings.monthlyInd=APP.settings.indLimit;
  APP.settings.monthlyCap=APP.settings.capLimit;
  APP.settings.forecastWarningRatio=Math.max(50,Math.min(99,Number(APP.settings.forecastWarningRatio)||80));
  if(APP.settings.whatsappPrompt===undefined)APP.settings.whatsappPrompt=true;

  function limitColor(value,limit){if(value>=limit)return 'var(--red)';if(value>=limit*APP.settings.forecastWarningRatio/100)return 'var(--orange)';return 'var(--green)'}
  function ratioRing(label,value,limit,energy,unit){
    const progress=Math.min(100,Math.max(0,(Number(value)||0)/(Number(limit)||1)*100));
    const state=value>=limit?'danger':value>=limit*APP.settings.forecastWarningRatio/100?'near':'';
    return `<article class="ratio-card ${state}"><div class="ratio-title">${esc(label)}</div><div class="ratio-ring" style="--ring-p:${progress};--ring-color:${limitColor(value,limit)}"><div class="ratio-ring-copy"><b>%${fmt(value)}</b><span>limit kullanımı %${fmt(progress,0)}</span></div></div><div class="ratio-energy">${fmt(energy,3)} ${unit}</div><div class="ratio-limit">Aylık limit: %${limit}</div></article>`;
  }
  function monthlyRings(r){return `<div class="ratio-rings">${ratioRing('Aylık İndüktif',r.indRatio,APP.settings.indLimit,r.current.indKvarh,'kvarh')}${ratioRing('Aylık Kapasitif',r.capRatio,APP.settings.capLimit,r.current.capKvarh,'kvarh')}</div>`}

  openDrawer=function(){const d=$('#drawer');d.className='drawer';d.innerHTML=`<aside class="drawer-panel"><div class="drawer-head"><div class="row"><img src="ets_logo.png" class="ets-logo drawer-logo" alt="ETS"><div><b>ETS Enerji Takip</b><div class="sub">Enerji Yönetim Sistemi</div></div><button class="iconbtn drawer-close" style="margin-left:auto" onclick="closeDrawer()">×</button></div></div><div class="drawer-kicker">Menü</div><button class="drawer-item" onclick="closeDrawer();showDashboard()">${icon('home')} Ana Sayfa</button><button class="drawer-item" onclick="closeDrawer();showCompanies()">${icon('companies')} Şirketler</button><button class="drawer-item" onclick="closeDrawer();showAlerts()">${icon('alert')} Limit Uyarıları</button><button class="drawer-item" onclick="closeDrawer();showMonthlyForecast()">${icon('reports')} Aylık Limit Tahmini</button><button class="drawer-item" onclick="closeDrawer();showReports()">${icon('reports')} Raporlar</button><button class="drawer-item" onclick="closeDrawer();showSettings()">${icon('settings')} Ayarlar</button><button class="drawer-item" onclick="closeDrawer();showAbout()">${icon('info')} Hakkında</button><div class="drawer-kicker">Oturum</div><button class="drawer-item red" onclick="closeDrawer();logout()">${icon('logout')} Çıkış Yap</button></aside>`}

  showDashboard=function(){if(!APP.logged&&APP.companies.length===0)return showLogin();APP.report=null;const bad=APP.alerts.filter(a=>a.active).length,last=localStorage.getItem('etm_last_scan')||'Henüz kontrol edilmedi';let forecast=[];try{forecast=JSON.parse(localStorage.getItem(forecastCacheKey())||'[]')}catch{}const risk=forecast.filter(x=>x.status==='forecast'||x.status==='near').length;app.innerHTML=`${topBar('Genel Bakış',false)}${offlineBar()}<main class="page"><section class="card dashboard-hero"><div class="sub">ETS Enerji Takip</div><h2 style="margin:5px 0 12px">Aylık enerji ve reaktif limit takibi</h2><div class="sub">Son senkronizasyon: ${esc(last)}</div><button class="btn btn-sm" style="margin-top:15px" onclick="scanAlerts(true)">${icon('refresh')} Şimdi Senkronize Et</button></section><div class="forecast-summary"><article><span class="sub">Toplam Şirket</span><b>${APP.companies.length}</b></article><article><span class="sub">Limit Aşımı</span><b class="${bad?'red':''}">${bad}</b></article><article><span class="sub">Aylık Risk</span><b class="${risk?'orange':''}">${risk}</b></article></div><div class="section-heading"><div><strong>Hızlı İşlemler</strong><span>Bir işlem seçin</span></div></div><div class="quick-grid"><section class="card quick-action" onclick="showCompanies()">${icon('companies')}<b>Şirketleri görüntüle</b></section><section class="card quick-action" onclick="showAlerts()">${icon('alert')}<b>Limit uyarıları</b></section><section class="card quick-action" onclick="showMonthlyForecast()">${icon('reports')}<b>Aylık limit tahmini</b></section><section class="card quick-action" onclick="showSettings()">${icon('settings')}<b>Uyarı ve WhatsApp</b></section></div></main>`}

  showDevice=function(tab=APP.tab){if(!APP.report)return showCompanies();APP.tab=tab;const r=APP.report,c=r.company;const title=tab==='daily'?'Aylık Enerji Özeti':tab==='current'?'Akım–Gerilim Raporu':'Aylık Reaktif Rapor';app.innerHTML=`${topBar(title)}${offlineBar()}<main class="page"><section class="device-card"><div class="device-company-row"><span class="company-avatar">${esc(initials(c.name))}</span><div><div class="device-title">${esc(c.name)}</div><div class="company-meta"><span class="status">Aktif</span><span>Firma kodu ${esc(c.id)}</span></div></div></div><div class="meta-grid"><div><span class="meta-label">Modem / IMEI</span><strong class="meta-value">${esc(r.imei||'—')}</strong></div><div><span class="meta-label">Rapor Dönemi</span><strong class="meta-value">${MONTHS[r.month-1]} ${r.year}</strong></div><div><span class="meta-label">İlk / Son Veri</span><strong class="meta-value">${esc(r.records[0]?.date||'—')} – ${esc(r.lastRead||r.records.at(-1)?.date||'—')}</strong></div><div><span class="meta-label">Kayıt Sayısı</span><strong class="meta-value">${r.records.length}</strong></div></div></section><section class="thin-info"><span>İndüktif Limit: <b>%${APP.settings.indLimit}</b></span><span>Kapasitif Limit: <b>%${APP.settings.capLimit}</b></span></section><nav class="tabs" aria-label="Rapor tipi"><button class="tab ${tab==='daily'?'active':''}" onclick="showDevice('daily')">Aylık Özet</button><button class="tab ${tab==='current'?'active':''}" onclick="showDevice('current')">Akım / Gerilim</button><button class="tab ${tab==='reactive'?'active':''}" onclick="showDevice('reactive')">Reaktif</button></nav><section class="monthbar"><button class="btn btn-sm" onclick="changeMonth(-1)">‹ Önceki</button><div class="monthpick">${MONTHS[r.month-1]} ${r.year}</div><button class="btn btn-sm" onclick="changeMonth(1)">Sonraki ›</button></section>${deviceTab(r,tab)}</main>`}

  dailyTab=function(r){return `<div class="monthly-note"><b>${MONTHS[r.month-1]} ${r.year} aylık özeti</b><br>İndüktif ve kapasitif oranlar aylık enerji değerlerinden hesaplanır.</div><div class="monthly-metrics"><article class="monthly-metric"><span>Ortalama Akım</span><b>${fmt(r.avgA)} A</b><small>L1–L3 ortalaması</small></article><article class="monthly-metric"><span>Ortalama Gerilim</span><b>${fmt(r.avgV)} V</b><small>L1–L3 ortalaması</small></article><article class="monthly-metric"><span>Aktif Güç</span><b>${fmt(r.activePower,2)} kW</b><small>Tahmini üç faz</small></article></div>${monthlyRings(r)}${warningHtml(r)}<div class="reactive-box"><article class="bigmetric"><span class="sub">Aylık Aktif Enerji</span><b>${fmt(r.current.kwh,3)} kWh</b></article><article class="bigmetric"><span class="sub">Son Veri</span><b style="font-size:15px">${esc(r.lastRead||'—')}</b></article></div><div class="small-actions export-actions"><button class="btn btn-soft btn-sm" onclick="showTableReport()">Aylık Tablo</button><button class="btn btn-soft btn-sm" onclick="exportExcel()">${icon('excel')} Excel</button><button class="btn btn-soft btn-sm" onclick="exportPdf()">${icon('pdf')} PDF</button></div>`}

  gaugeHtml=function(ind,cap){const r=APP.report;return r?monthlyRings(r):`<div class="ratio-rings">${ratioRing('Aylık İndüktif',ind,APP.settings.indLimit,NaN,'kvarh')}${ratioRing('Aylık Kapasitif',cap,APP.settings.capLimit,NaN,'kvarh')}</div>`}

  warningHtml=function(r){const msgs=[];if(r.indRatio>=APP.settings.indLimit)msgs.push(`Aylık indüktif oran %${fmt(r.indRatio)} ile %${APP.settings.indLimit} limitini aştı.`);if(r.capRatio>=APP.settings.capLimit)msgs.push(`Aylık kapasitif oran %${fmt(r.capRatio)} ile %${APP.settings.capLimit} limitini aştı.`);return msgs.length?`<div class="warnbox"><b>⚠</b><div class="grow">${msgs.map(esc).join('<br>')}</div><button class="btn btn-primary btn-sm" onclick="sendWhatsAppCurrent()">WhatsApp</button></div>`:''}

  reactiveTab=function(r){return `<div class="monthly-note"><b>Aylık reaktif görünüm</b><br>Bu sayfa yalnızca seçili ayın indüktif ve kapasitif toplamlarını ve oranlarını gösterir.</div>${monthlyRings(r)}<div class="reactive-box"><article class="bigmetric"><span class="sub">Aylık İndüktif Enerji</span><b>${fmt(r.current.indKvarh,3)} kvarh</b></article><article class="bigmetric"><span class="sub">Aylık Kapasitif Enerji</span><b>${fmt(r.current.capKvarh,3)} kvarh</b></article></div>${warningHtml(r)}<div class="small-actions export-actions"><button class="btn btn-soft btn-sm" onclick="exportExcel()">${icon('excel')} Excel</button><button class="btn btn-soft btn-sm" onclick="exportPdf()">${icon('pdf')} PDF</button></div>`}

  checkReportAlert=function(company,r,popup=false){const exceeded=[];if(r.indRatio>=APP.settings.indLimit)exceeded.push({type:'İndüktif',value:r.indRatio,limit:APP.settings.indLimit});if(r.capRatio>=APP.settings.capLimit)exceeded.push({type:'Kapasitif',value:r.capRatio,limit:APP.settings.capLimit});const activeKeys=new Set();for(const x of exceeded){const key=`${company.id}_${x.type}_${r.month}_${r.year}`;activeKeys.add(key);let a=APP.alerts.find(z=>z.key===key);if(!a){a={key,companyId:company.id,company:company.name,type:x.type,value:x.value,limit:x.limit,time:new Date().toISOString(),active:true,month:r.month,year:r.year};APP.alerts.unshift(a)}else{a.value=x.value;a.limit=x.limit;a.active=true;a.time=new Date().toISOString()}}APP.alerts.filter(a=>String(a.companyId)===String(company.id)&&a.month===r.month&&a.year===r.year).forEach(a=>{if(!activeKeys.has(a.key))a.active=false});saveAlerts();if(popup&&exceeded.length&&APP.settings.notifications){modal('Aylık Limit Uyarısı',`<b>${esc(company.name)}</b><br>${exceeded.map(x=>`${x.type}: <b class="red">%${fmt(x.value)}</b> / limit %${x.limit}`).join('<br>')}`,`<button class="btn btn-primary btn-block" onclick="closeModal();sendWhatsAppCurrent()">WhatsApp Mesajı Hazırla</button><button class="btn btn-soft btn-block" style="margin-top:8px" onclick="closeModal()">Tamam</button>`)}}

  showAlerts=function(){const active=APP.alerts.filter(a=>a.active),past=APP.alerts.filter(a=>!a.active);app.innerHTML=`${topBar('Aylık Limit Uyarıları',false)}<main class="page"><div class="row between"><div><h1 class="section-title" style="margin-bottom:2px">Aktif Uyarılar</h1><div class="sub">İndüktif %${APP.settings.indLimit} • Kapasitif %${APP.settings.capLimit}</div></div><button class="btn btn-soft btn-sm" onclick="scanAlerts(true)">↻ Kontrol Et</button></div>${active.length?`<div class="small-actions"><button class="btn btn-primary btn-block" onclick="sendWhatsAppAllAlerts()">Tüm Uyarıları WhatsApp'a Hazırla</button></div>${active.map(alertHtml).join('')}`:'<div class="empty">Aktif aylık limit uyarısı yok.</div>'}${past.length?`<h2 class="section-title">Geçmiş Uyarılar</h2>${past.slice(0,20).map(alertHtml).join('')}`:''}<div class="whatsapp-note">WhatsApp güvenlik kuralları nedeniyle uygulama mesajı otomatik olarak göndermez. Mesajı belirtilen numara için hazırlar; WhatsApp açıldığında Gönder düğmesine dokunursunuz.</div></main>`}

  alertHtml=function(a){const danger=a.value>=a.limit;return `<section class="card alert-item"><span class="alert-icon ${danger?'danger':''}">⚠</span><div><div class="strong">${esc(a.company)}</div><div class="sub">Aylık ${esc(a.type)} oranı limitini aştı</div><div class="sub">${new Date(a.time).toLocaleString('tr-TR')}</div></div><div class="center"><div class="alert-value ${danger?'red':'orange'}">%${fmt(a.value)}</div><button class="btn btn-soft btn-sm" onclick="sendWhatsAppAlert('${encodeURIComponent(a.key)}')">WhatsApp</button></div></section>`}

  scanAlerts=async function(show=true){if(!APP.companies.length)return;show&&toast('Şirketler aylık limitler için kontrol ediliyor...');await runPool(APP.companies,4,async c=>{const r=await loadReport(c,new Date().getMonth()+1,new Date().getFullYear());checkReportAlert(c,r,false)},(done,total)=>{if(show&&(done===total||done%5===0))toast(`${done}/${total} kontrol edildi`)});localStorage.setItem('etm_last_scan',new Date().toLocaleString('tr-TR'));const count=APP.alerts.filter(a=>a.active).length;show&&toast(`Senkronizasyon tamamlandı: ${count} aktif uyarı`);if(show){showAlerts();if(count&&APP.settings.whatsapp&&APP.settings.whatsappPrompt&&APP.settings.phone)setTimeout(()=>modal('WhatsApp Uyarı Özeti',`${count} aktif limit uyarısı bulundu.<br>Belirlediğiniz numara için toplu mesaj hazırlansın mı?`,`<button class="btn btn-primary btn-block" onclick="closeModal();sendWhatsAppAllAlerts()">WhatsApp Mesajını Hazırla</button><button class="btn btn-soft btn-block" style="margin-top:8px" onclick="closeModal()">Daha Sonra</button>`),250)}}

  function reportForecast(r){
    const now=new Date(),daysInMonth=new Date(r.year,r.month,0).getDate();
    const isCurrent=r.year===now.getFullYear()&&r.month===now.getMonth()+1;
    const remaining=isCurrent?Math.max(0,daysInMonth-now.getDate()):0;
    const valid=r.records.filter(x=>Number.isFinite(x.activeDiff)&&x.activeDiff>0);
    const totalA=valid.reduce((s,x)=>s+x.activeDiff,0),totalI=valid.reduce((s,x)=>s+(Number.isFinite(x.indDiff)?x.indDiff:0),0),totalC=valid.reduce((s,x)=>s+(Number.isFinite(x.capDiff)?x.capDiff:0),0);
    const recent=valid.slice(-Math.min(7,valid.length));
    const avgA=recent.length?recent.reduce((s,x)=>s+x.activeDiff,0)/recent.length:0;
    const avgI=recent.length?recent.reduce((s,x)=>s+(Number.isFinite(x.indDiff)?x.indDiff:0),0)/recent.length:0;
    const avgC=recent.length?recent.reduce((s,x)=>s+(Number.isFinite(x.capDiff)?x.capDiff:0),0)/recent.length:0;
    const projectedA=totalA+avgA*remaining,projectedI=totalI+avgI*remaining,projectedC=totalC+avgC*remaining;
    const projectedInd=projectedA>0?projectedI/projectedA*100:r.indRatio;
    const projectedCap=projectedA>0?projectedC/projectedA*100:r.capRatio;
    const reached=r.indRatio>=APP.settings.indLimit||r.capRatio>=APP.settings.capLimit;
    const forecast=!reached&&(projectedInd>=APP.settings.indLimit||projectedCap>=APP.settings.capLimit);
    const near=!reached&&!forecast&&(projectedInd>=APP.settings.indLimit*APP.settings.forecastWarningRatio/100||projectedCap>=APP.settings.capLimit*APP.settings.forecastWarningRatio/100);
    return {currentInd:r.indRatio,currentCap:r.capRatio,projectedInd:Number.isFinite(projectedInd)?projectedInd:r.indRatio,projectedCap:Number.isFinite(projectedCap)?projectedCap:r.capRatio,remaining,status:reached?'reached':forecast?'forecast':near?'near':'safe'};
  }
  function forecastCacheKey(){const d=new Date();return `etm_forecast_${d.getMonth()+1}_${d.getFullYear()}`}
  function loadForecastCache(){try{APP.forecast=JSON.parse(localStorage.getItem(forecastCacheKey())||'[]')}catch{APP.forecast=[]}}
  function forecastStatusLabel(x){return x.status==='reached'?'Limit aşıldı':x.status==='forecast'?'Ay sonunda limite ulaşabilir':'Limite yaklaşıyor'}
  function forecastStatusClass(x){return x.status==='reached'?'reached':x.status==='near'?'near':''}
  function forecastRing(value,limit){const p=Math.min(100,Math.max(0,value/limit*100));return `<span class="ring-mini" style="--ring-p:${p};--ring-color:${limitColor(value,limit)}"><b>%${fmt(value,0)}</b></span>`}
  function forecastItem(x){return `<section class="forecast-card ${forecastStatusClass(x)}"><div class="forecast-head" onclick="openForecastCompany('${encodeURIComponent(x.id)}')">${forecastRing(Math.max(x.projectedInd,x.projectedCap),Math.max(APP.settings.indLimit,APP.settings.capLimit))}<div class="company-copy"><div class="strong">${esc(x.company.name)}</div><div class="sub">Sayaç ${esc(x.id)} • ${forecastStatusLabel(x)}</div><div class="forecast-badges"><span class="pill ${x.status==='reached'?'redp':'orangep'}">${x.remaining} gün kaldı</span></div></div><span class="chev">${icon('chevron')}</span></div><div class="forecast-values"><div class="forecast-value"><span>İndüktif: mevcut → tahmin</span><b>%${fmt(x.currentInd)} → %${fmt(x.projectedInd)}</b></div><div class="forecast-value"><span>Kapasitif: mevcut → tahmin</span><b>%${fmt(x.currentCap)} → %${fmt(x.projectedCap)}</b></div></div><div class="forecast-actions"><button class="btn btn-soft btn-sm" onclick="openForecastCompany('${encodeURIComponent(x.id)}')">Raporu Aç</button><button class="btn btn-primary btn-sm" onclick="sendWhatsAppForecast('${encodeURIComponent(x.id)}')">WhatsApp</button></div></section>`}
  function forecastContent(){const reached=APP.forecast.filter(x=>x.status==='reached').length,forecast=APP.forecast.filter(x=>x.status==='forecast').length,near=APP.forecast.filter(x=>x.status==='near').length;return `<div class="forecast-summary"><article><span class="sub">Limit Aşıldı</span><b class="red">${reached}</b></article><article><span class="sub">Ulaşma Tahmini</span><b class="orange">${forecast}</b></article><article><span class="sub">Yaklaşan</span><b>${near}</b></article></div>${APP.forecast.length?APP.forecast.map(forecastItem).join(''):'<div class="empty">Tahmin bulunmuyor. Şirketleri taramak için Raporu Hesapla düğmesine basın.</div>'}`}

  window.showMonthlyForecast=function(){loadForecastCache();const now=new Date();app.innerHTML=`${topBar('Aylık Limit Tahmini',false)}<main class="page"><section class="card"><div class="row between"><div><b>${MONTHS[now.getMonth()]} ${now.getFullYear()}</b><div class="sub">Son 7 günlük enerji eğilimine göre tahmin</div></div><button class="btn btn-primary btn-sm" onclick="scanMonthlyForecast()">Raporu Hesapla</button></div></section><div id="forecastContent">${forecastContent()}</div><div class="whatsapp-note">Tahmin, günlük aktif/reaktif enerji farklarının son 7 günlük ortalamasıyla hesaplanır. Gerçek ay sonu oranı tüketim davranışına göre değişebilir.</div></main>`}

  window.scanMonthlyForecast=async function(){if(APP.forecastScanRunning||!APP.companies.length)return;APP.forecastScanRunning=true;const host=$('#forecastContent');host.innerHTML=`<section class="card"><b>Aylık tahmin hesaplanıyor...</b><div class="progress"><span id="forecastProgress"></span></div><div class="sub" id="forecastLabel">0 / ${APP.companies.length}</div></section>`;const now=new Date(),out=[];await runPool(APP.companies,4,async c=>{const r=await loadReport(c,now.getMonth()+1,now.getFullYear());const f=reportForecast(r);if(f.status!=='safe')out.push({company:c,id:c.id,report:r,...f})},(done,total)=>{const p=$('#forecastProgress'),l=$('#forecastLabel');if(p)p.style.width=(done/total*100)+'%';if(l)l.textContent=`${done} / ${total}`});APP.forecast=out.sort((a,b)=>{const rank={reached:3,forecast:2,near:1};return rank[b.status]-rank[a.status]||Math.max(b.projectedInd/APP.settings.indLimit,b.projectedCap/APP.settings.capLimit)-Math.max(a.projectedInd/APP.settings.indLimit,a.projectedCap/APP.settings.capLimit)});localStorage.setItem(forecastCacheKey(),JSON.stringify(APP.forecast));APP.forecastScanRunning=false;host.innerHTML=forecastContent();toast('Aylık limit tahmini hazırlandı.')}
  window.openForecastCompany=function(enc){const id=decodeURIComponent(enc),x=APP.forecast.find(z=>String(z.id)===id);if(!x)return;APP.current=x.company;APP.report=x.report;showDevice('daily')}
  window.sendWhatsAppForecast=function(enc){const id=decodeURIComponent(enc),x=APP.forecast.find(z=>String(z.id)===id);if(!x)return;openWhatsApp(`ETS Aylık Limit Tahmini\nŞirket: ${x.company.name}\nDönem: ${MONTHS[x.report.month-1]} ${x.report.year}\nİndüktif: mevcut %${fmt(x.currentInd)}, ay sonu tahmini %${fmt(x.projectedInd)}, limit %${APP.settings.indLimit}\nKapasitif: mevcut %${fmt(x.currentCap)}, ay sonu tahmini %${fmt(x.projectedCap)}, limit %${APP.settings.capLimit}\nDurum: ${forecastStatusLabel(x)}\nTarih: ${new Date().toLocaleString('tr-TR')}`)}

  showSettings=function(){app.innerHTML=`${topBar('Uyarı ve WhatsApp Ayarları',false)}<main class="page"><h1 class="section-title">Aylık Limit Değerleri</h1><section class="card"><div class="setting-row"><label>İndüktif Uyarı Limiti (%)</label><input id="indLimit" class="input" type="number" min="0.1" step="0.1" value="${APP.settings.indLimit}"><div class="settings-hint">Varsayılan: %20</div></div><div class="setting-row"><label>Kapasitif Uyarı Limiti (%)</label><input id="capLimit" class="input" type="number" min="0.1" step="0.1" value="${APP.settings.capLimit}"><div class="settings-hint">Varsayılan: %15</div></div><div class="setting-row"><label>Yaklaşan Limit Uyarısı (%)</label><input id="forecastWarningRatio" class="input" type="number" min="50" max="99" step="1" value="${APP.settings.forecastWarningRatio}"><div class="settings-hint">Örneğin 80, limitin %80'ine ulaşan şirketleri tahmin sayfasında gösterir.</div></div></section><h2 class="section-title">Bildirim Ayarları</h2><section class="card"><div class="row between setting-row"><div><b>Uygulama Uyarıları</b><div class="sub">Uygulama açıkken periyodik aylık kontrol</div></div><label class="switch"><input id="notifications" type="checkbox" ${APP.settings.notifications?'checked':''}><span></span></label></div><div class="setting-row"><label>Kontrol Aralığı (dakika)</label><input id="interval" class="input" type="number" min="5" value="${APP.settings.interval}"></div></section><h2 class="section-title">WhatsApp Ayarları</h2><section class="card"><div class="setting-row"><label>Bildirim Numarası</label><input id="phone" class="input" inputmode="tel" value="${esc(APP.settings.phone)}" placeholder="+90 555 123 45 67"><div class="sub">Numarayı ülke koduyla yazın.</div></div><div class="row between setting-row"><b>WhatsApp Mesajları</b><label class="switch"><input id="whatsapp" type="checkbox" ${APP.settings.whatsapp?'checked':''}><span></span></label></div><div class="row between"><div><b>Tarama Sonrası Hatırlat</b><div class="sub">Aktif uyarı varsa toplu mesaj düğmesini gösterir.</div></div><label class="switch"><input id="whatsappPrompt" type="checkbox" ${APP.settings.whatsappPrompt?'checked':''}><span></span></label></div></section><div class="whatsapp-note">Uygulama WhatsApp mesajını seçtiğiniz numara için hazırlar. WhatsApp'ın güvenlik politikası nedeniyle son Gönder işlemi kullanıcı tarafından yapılır.</div><h2 class="section-title">Sunucu</h2><section class="card"><label>Site Adresi</label><input id="baseUrl" class="input" value="${esc(APP.base)}"></section><button class="btn btn-primary btn-block" onclick="saveSettingsForm()">Kaydet</button></main>`}

  saveSettingsForm=function(){const n=id=>Number($('#'+id).value);APP.settings.indLimit=n('indLimit')||DEFAULT_IND_LIMIT;APP.settings.capLimit=n('capLimit')||DEFAULT_CAP_LIMIT;APP.settings.monthlyInd=APP.settings.indLimit;APP.settings.monthlyCap=APP.settings.capLimit;APP.settings.forecastWarningRatio=Math.max(50,Math.min(99,n('forecastWarningRatio')||80));APP.settings.interval=Math.max(5,n('interval')||15);APP.settings.phone=$('#phone').value.trim();APP.settings.notifications=$('#notifications').checked;APP.settings.whatsapp=$('#whatsapp').checked;APP.settings.whatsappPrompt=$('#whatsappPrompt').checked;APP.settings.schemaVersion=17;APP.base=$('#baseUrl').value.trim().replace(/\/$/,'')||APP.base;saveSettings();startMonitor();toast('Ayarlar kaydedildi.')}

  openWhatsApp=function(message){if(!APP.settings.whatsapp){toast('WhatsApp bildirimleri ayarlardan kapalı.');return}const phone=(APP.settings.phone||'').replace(/\D/g,'');if(!phone){toast('Ayarlar bölümünden WhatsApp numarası giriniz.');showSettings();return}const url=`https://wa.me/${phone}?text=${encodeURIComponent(message)}`;if(window.AndroidHttp&&typeof window.AndroidHttp.openExternal==='function')window.AndroidHttp.openExternal(url);else location.href=url}
  whatsappMessage=function(company,type,value,limit){return `ETS Enerji Takip Aylık Limit Uyarısı\nŞirket: ${company}\n${type} aylık oranı limit değerini aştı.\nMevcut Değer: %${fmt(value)}\nLimit Değeri: %${limit}\nTarih: ${new Date().toLocaleString('tr-TR')}`}
  sendWhatsAppCurrent=function(){const r=APP.report;if(!r)return;const parts=[];if(r.indRatio>=APP.settings.indLimit)parts.push(`İndüktif %${fmt(r.indRatio)} / limit %${APP.settings.indLimit}`);if(r.capRatio>=APP.settings.capLimit)parts.push(`Kapasitif %${fmt(r.capRatio)} / limit %${APP.settings.capLimit}`);openWhatsApp(`ETS Enerji Takip Aylık Limit Uyarısı\nŞirket: ${r.company.name}\nDönem: ${MONTHS[r.month-1]} ${r.year}\n${parts.join('\n')}\nTarih: ${new Date().toLocaleString('tr-TR')}`)}
  sendWhatsAppAlert=function(enc){const key=decodeURIComponent(enc),a=APP.alerts.find(x=>x.key===key);if(a)openWhatsApp(whatsappMessage(a.company,a.type,a.value,a.limit))}
  window.sendWhatsAppAllAlerts=function(){const active=APP.alerts.filter(a=>a.active);if(!active.length)return toast('Gönderilecek aktif uyarı yok.');const grouped=new Map();active.forEach(a=>{if(!grouped.has(a.company))grouped.set(a.company,[]);grouped.get(a.company).push(`${a.type} %${fmt(a.value)} (limit %${a.limit})`)});const lines=[`ETS Enerji Takip — Aylık Limit Uyarıları`,`Tarih: ${new Date().toLocaleString('tr-TR')}`,`Toplam şirket: ${grouped.size}`,''];for(const [company,items] of grouped)lines.push(`• ${company}: ${items.join(' • ')}`);openWhatsApp(lines.join('\n'))}

  showLogin=function(){APP.report=null;app.innerHTML=`${offlineBar()}<main class="login-wrap"><section class="login-hero"><img src="ets_logo.png" class="ets-logo login-logo" alt="ETS"><h1>ETS Enerji Takip</h1><p>Enerji Takip Sistemi</p></section><section class="card login-panel"><h2>Sisteme Hoş Geldiniz</h2><div class="sub login-help">Giriş yapmak için kullanıcı bilgilerinizi giriniz.</div><div class="login-field">${icon('companies')}<input id="user" class="input" autocomplete="username" value="${esc(localStorage.getItem('etm_user')||'')}" placeholder="Kullanıcı adı"></div><div class="login-field">${icon('settings')}<input id="pass" class="input" type="password" autocomplete="current-password" placeholder="Parola"></div><label class="check"><input id="remember" type="checkbox" ${localStorage.getItem('etm_user')?'checked':''}> Beni Hatırla</label><div class="login-actions"><button id="loginBtn" class="btn btn-primary btn-block" onclick="doLogin()">Giriş Yap</button></div><div id="loginError" class="sub red center" style="margin-top:12px"></div></section><div class="version">Sürüm 2.0.4 • 2026</div></main>`}
  showAbout=function(){app.innerHTML=`${topBar('Hakkında',false)}<main class="page"><img src="ets_logo.png" class="ets-logo about-logo-img" alt="ETS"><div class="center strong" style="font-size:20px">Enerji Takip Sistemi</div><section class="card" style="margin-top:23px"><h3>Uygulama Hakkında</h3><p class="sub" style="font-size:14px">Bu uygulama aylık aktif enerji, indüktif ve kapasitif oranları izler; ay sonu limit risklerini tahmin eder ve WhatsApp mesajlarını hazırlar.</p><hr style="border:0;border-top:1px solid #eee"><div class="row between"><span>Sürüm</span><b>1.0.23</b></div><div class="row between" style="margin-top:12px"><span>Web Sitesi</span><b>www.etm.com.tr</b></div><div class="row between" style="margin-top:12px"><span>Yıl</span><b>2026</b></div></section><div class="center sub">Uygulama ETM Mühendislik tarafından hazırlanmıştır.</div><div class="credit">IZADEEN N A SAWAFIRI<br>2026</div></main>`}

  // Re-render with the upgraded functions and migrated settings.
  localStorage.removeItem('etm_logged');APP.logged=false;showLogin();
})();
</script>


<script>
/* v1.0.23 exact Aylik_Liste + IsletmeAyarlari integration */
(function(){
  function companySettingsUrl(company){
    if(company&&company.settingsHref){
      try{return new URL(company.settingsHref,absolute(APP.companySource)).href}catch{}
    }
    return new URL('/admin/IsletmeAyarlari.aspx?id='+encodeURIComponent(company.id),APP.base+'/').href;
  }

  reportCandidates=function(company,month,year){
    const out=[],seen=new Set();
    const push=u=>{
      try{
        const href=new URL(String(u||''),absolute(APP.companySource)).href;
        if(!seen.has(href)){seen.add(href);out.push(href)}
      }catch{}
    };
    if(company.href){
      try{
        const exact=new URL(company.href,absolute(APP.companySource));
        const dated=new URL(exact.href);
        dated.searchParams.set('FirmaId',company.id);
        dated.searchParams.set('ay',month);
        dated.searchParams.set('yil',year);
        dated.searchParams.set('ftext',company.name);
        push(dated.href);
        push(exact.href);
      }catch{push(company.href)}
    }
    const fallback=new URL('/Aylik_Liste.aspx',APP.base+'/');
    fallback.searchParams.set('FirmaId',company.id);
    fallback.searchParams.set('ay',month);
    fallback.searchParams.set('yil',year);
    fallback.searchParams.set('ftext',company.name);
    push(fallback.href);
    return out;
  };

  function detailsPageState(html){
    const state=reportPageState(html);
    const body=txt(new DOMParser().parseFromString(html||'','text/html').body?.textContent||'');
    return {...state,notFound:/Sayfa bulunamadı|Page not found|404/i.test(body)};
  }

  function parseCompanyDetails(html,company,url){
    const doc=new DOMParser().parseFromString(html||'','text/html');
    const pairs=new Map();
    const add=(rawLabel,rawValue)=>{
      let label=txt(rawLabel).replace(/[\s:*]+$/,'').trim();
      let value=txt(rawValue).trim();
      if(!label||!value||label.length>100||value.length>500)return;
      if(/^(__VIEWSTATE|__EVENTVALIDATION|BUTTON|KAYDET|SIL|VAZGEÇ|IPTAL)$/i.test(label))return;
      const key=norm(label);
      if(!key||key.startsWith('__')||/VIEWSTATE|EVENTVALIDATION/.test(key))return;
      if(!pairs.has(key))pairs.set(key,{label,value});
    };
    const controlValue=el=>{
      if(!el)return '';
      if(el.tagName==='SELECT')return txt(el.selectedOptions?.[0]?.textContent||el.value);
      if(el.type==='checkbox'||el.type==='radio')return el.checked?'Evet':'Hayır';
      return txt(el.value||el.textContent||'');
    };

    doc.querySelectorAll('tr').forEach(row=>{
      const cells=[...row.querySelectorAll(':scope > th,:scope > td')];
      if(cells.length>=2)add(cells[0].textContent,cells.slice(1).map(x=>x.textContent).join(' '));
    });
    doc.querySelectorAll('dt').forEach(dt=>{const dd=dt.nextElementSibling;if(dd&&dd.tagName==='DD')add(dt.textContent,dd.textContent)});
    doc.querySelectorAll('label').forEach(label=>{
      let control=null;
      const id=label.getAttribute('for');
      if(id)control=doc.getElementById(id);
      if(!control)control=label.parentElement?.querySelector('input:not([type=hidden]),select,textarea');
      if(!control)control=label.closest('.form-group,.control-group,.row,td,div')?.querySelector('input:not([type=hidden]),select,textarea');
      add(label.textContent,controlValue(control));
    });
    doc.querySelectorAll('input:not([type=hidden]):not([type=submit]):not([type=button]),select,textarea').forEach(el=>{
      const label=[...doc.querySelectorAll('label[for]')].find(x=>x.getAttribute('for')===(el.id||''))?.textContent
        ||el.getAttribute('aria-label')||el.getAttribute('placeholder')||el.name||el.id;
      add(label,controlValue(el));
    });
    const bodyLines=(doc.body?.innerText||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);
    bodyLines.forEach(line=>{
      const m=line.match(/^([^:]{2,70})\s*:\s*(.{1,300})$/);
      if(m)add(m[1],m[2]);
    });

    const entries=[...pairs.entries()];
    const get=(patterns)=>{
      for(const [key,obj] of entries){
        if(patterns.some(pattern=>pattern.test(key)))return obj.value;
      }
      return '';
    };
    const details={
      url,
      firmaId:String(company.id),
      businessName:get([/^ISLETME ADI$/, /^FIRMA ADI$/, /^SIRKET ADI$/, /^UNVAN$/])||company.name,
      meterNo:get([/SAYAC.*(NO|NUMARA)/,/CIHAZ.*(NO|NUMARA)/,/ABONE.*(NO|NUMARA)/]),
      modemNo:get([/MODEM.*(NO|NUMARA)/,/GPRS.*(NO|NUMARA)/]),
      imei:get([/^IMEI$/,/MODEM.*IMEI/]),
      currentTransformerRatio:get([/AKIM.*TRAFO.*ORAN/]),
      voltageTransformerRatio:get([/GERILIM.*TRAFO.*ORAN/]),
      firstData:get([/ILK.*VERI/,/ILK.*OKUMA/]),
      lastData:get([/SON.*VERI/,/SON.*OKUMA/]),
      status:get([/^DURUM$/,/AKTIF.*PASIF/]),
      phone:get([/TELEFON/,/^TEL$/,/GSM/]),
      email:get([/E.?POSTA/,/EMAIL/]),
      address:get([/ADRES/]),
      pairs:Object.fromEntries(entries.map(([key,obj])=>[key,obj]))
    };
    return details;
  }

  function companyDetailsHasData(d){
    if(!d)return false;
    return ['meterNo','modemNo','imei','currentTransformerRatio','voltageTransformerRatio','firstData','lastData','phone','email','address']
      .some(k=>!!d[k])||Object.keys(d.pairs||{}).length>0;
  }

  async function loadCompanyDetails(company,allowRendered=false){
    const url=companySettingsUrl(company),diagnostics=[];
    try{
      const r=await fetchText(url),state=detailsPageState(r.text);
      if(state.login)throw new Error('İşletme ayarları için giriş sayfası döndü.');
      if(state.denied)throw new Error('İşletme ayarlarını görüntüleme yetkisi yok.');
      if(state.notFound)throw new Error('İşletme ayarları sayfası bulunamadı.');
      const details=parseCompanyDetails(r.text,company,r.url||url);
      if(companyDetailsHasData(details))return details;
      diagnostics.push('static page had no readable fields');
    }catch(e){diagnostics.push(e.message)}

    if(allowRendered){
      try{
        const rendered=await loadRenderedReportPage(url),state=detailsPageState(rendered.text||'');
        if(rendered.login||state.login)throw new Error('rendered login page returned');
        if(rendered.denied||state.denied)throw new Error('rendered permission denied');
        const details=parseCompanyDetails(rendered.text||'',company,rendered.url||url);
        if(companyDetailsHasData(details))return details;
        diagnostics.push('rendered page had no readable fields');
      }catch(e){diagnostics.push(e.message)}
    }
    throw new Error('İşletme ayarları okunamadı: '+diagnostics.join(' • '));
  }
  window.loadCompanyDetails=loadCompanyDetails;
  window.parseCompanyDetailsV1020=parseCompanyDetails;

  function companyDetailsHtml(r){
    const c=r.company,d=c.details||r.companyDetails||null;
    const rows=[
      ['Sayaç No',d?.meterNo],
      ['Modem No',d?.modemNo],
      ['IMEI',d?.imei||r.imei],
      ['Akım Trafo Oranı',d?.currentTransformerRatio],
      ['Gerilim Trafo Oranı',d?.voltageTransformerRatio],
      ['İlk Veri Zamanı',d?.firstData],
      ['Son Veri Zamanı',d?.lastData],
      ['Telefon',d?.phone],
      ['E-posta',d?.email],
      ['Adres',d?.address]
    ].filter(x=>x[1]);
    if(!rows.length){
      return `<section class="card"><div class="section-heading"><div><strong>İşletme Ayarları</strong><span>/admin/IsletmeAyarlari.aspx?id=${esc(c.id)}</span></div></div><div class="sub">${esc(c.detailsError||'Ayarlar sayfasında gösterilecek alan bulunamadı.')}</div></section>`;
    }
    return `<section class="card"><div class="section-heading"><div><strong>İşletme Ayarları</strong><span>Firma ID ${esc(c.id)} üzerinden okundu</span></div><span class="pill redp">Canlı</span></div><div class="meta-grid">${rows.map(([label,value])=>`<div><span class="meta-label">${esc(label)}</span><strong class="meta-value">${esc(value)}</strong></div>`).join('')}</div></section>`;
  }

  openCompany=async function(enc){
    const id=decodeURIComponent(enc),c=APP.companies.find(x=>String(x.id)===id);
    if(!c)return;
    c.settingsHref=companySettingsUrl(c);
    APP.dailyLimit=12;APP.current=c;APP.report=null;loading(c.name+' bilgileri ve aylık raporu okunuyor...');
    let details=null,detailsError='';
    try{details=await loadCompanyDetails(c,false)}catch(e){detailsError=e.message}
    try{
      APP.report=await loadReport(c,APP.month,APP.year,true);
      if(!details){
        try{details=await loadCompanyDetails(c,true)}catch(e){detailsError=e.message}
      }
      c.details=details;
      c.detailsError=detailsError;
      APP.report.companyDetails=details;
      if(details?.imei&&!APP.report.imei)APP.report.imei=details.imei;
      if(details?.lastData&&!APP.report.lastRead)APP.report.lastRead=details.lastData;
      saveReportCache(APP.report);cacheCompanies();checkReportAlert(c,APP.report,true);showDevice('daily');
    }catch(e){
      const cached=getReportCache(c.id,APP.month,APP.year);
      if(cached){
        c.details=details||c.details;c.detailsError=detailsError;
        APP.report=cached;APP.report.companyDetails=c.details||cached.companyDetails;
        toast('Bağlantı kurulamadı; kayıtlı rapor gösteriliyor.');showDevice('daily');
      }else{
        app.innerHTML=`${topBar('Enerji Raporu')}<main class="page"><section class="card center"><h2>Rapor okunamadı</h2><p class="sub">${esc(e.message)}</p><div class="sub" style="margin-top:10px">Beklenen rapor: /Aylik_Liste.aspx?FirmaId=${esc(c.id)}&amp;ay=${APP.month}&amp;yil=${APP.year}</div><div class="sub">İşletme ayarları: /admin/IsletmeAyarlari.aspx?id=${esc(c.id)}</div><button class="btn btn-primary" style="margin-top:16px" onclick="openCompany('${encodeURIComponent(id)}')">Tekrar Dene</button></section></main>`;
      }
    }
  };

  changeMonth=async function(delta){
    APP.dailyLimit=12;
    const d=new Date(APP.report.year,APP.report.month-1+delta,1);
    APP.month=d.getMonth()+1;APP.year=d.getFullYear();
    loading('Aylık rapor okunuyor...');
    try{
      APP.report=await loadReport(APP.current,APP.month,APP.year,true);
      APP.report.companyDetails=APP.current.details||null;
      if(APP.current.details?.imei&&!APP.report.imei)APP.report.imei=APP.current.details.imei;
      saveReportCache(APP.report);checkReportAlert(APP.current,APP.report,true);showDevice(APP.tab);
    }catch(e){
      toast(e.message);
      const cached=getReportCache(APP.current.id,APP.month,APP.year);
      if(cached){APP.report=cached;APP.report.companyDetails=APP.current.details||cached.companyDetails;showDevice(APP.tab)}
      else showCompanies();
    }
  };

  showDevice=function(tab=APP.tab){
    if(!APP.report)return showCompanies();
    APP.tab=tab;
    const r=APP.report,c=r.company;
    const title=tab==='daily'?'Aylık Enerji Özeti':tab==='current'?'Akım–Gerilim Raporu':'Aylık Reaktif Rapor';
    app.innerHTML=`${topBar(title)}${offlineBar()}<main class="page"><section class="device-card"><div class="device-company-row"><span class="company-avatar">${esc(initials(c.name))}</span><div><div class="device-title">${esc(c.name)}</div><div class="company-meta"><span class="status">Aktif</span><span>Firma kodu ${esc(c.id)}</span></div></div></div><div class="meta-grid"><div><span class="meta-label">Sayaç No</span><strong class="meta-value">${esc(c.details?.meterNo||'—')}</strong></div><div><span class="meta-label">Modem / IMEI</span><strong class="meta-value">${esc(c.details?.modemNo||r.imei||c.details?.imei||'—')}</strong></div><div><span class="meta-label">Rapor Dönemi</span><strong class="meta-value">${MONTHS[r.month-1]} ${r.year}</strong></div><div><span class="meta-label">Kayıt Sayısı</span><strong class="meta-value">${r.records.length}</strong></div></div></section>${companyDetailsHtml(r)}<section class="thin-info"><span>İndüktif Limit: <b>%${APP.settings.indLimit}</b></span><span>Kapasitif Limit: <b>%${APP.settings.capLimit}</b></span></section><nav class="tabs" aria-label="Rapor tipi"><button class="tab ${tab==='daily'?'active':''}" onclick="showDevice('daily')">Aylık Özet</button><button class="tab ${tab==='current'?'active':''}" onclick="showDevice('current')">Akım / Gerilim</button><button class="tab ${tab==='reactive'?'active':''}" onclick="showDevice('reactive')">Reaktif</button></nav><section class="monthbar"><button class="btn btn-sm" onclick="changeMonth(-1)">‹ Önceki</button><div class="monthpick">${MONTHS[r.month-1]} ${r.year}</div><button class="btn btn-sm" onclick="changeMonth(1)">Sonraki ›</button></section>${deviceTab(r,tab)}</main>`;
  };

  // Force one fresh login/company scrape so old cached links do not survive.
  if(localStorage.getItem('etm_exact_link_schema')!=='20'){
    localStorage.removeItem('etm_companies');
    localStorage.removeItem('etm_logged');
    localStorage.setItem('etm_exact_link_schema','20');
  }
})();
</script>


<script>
/* v1.0.23: /admin/ozet.aspx monthly ratios, no IsletmeAyarlari card */
(function(){
  const VERSION='2.0.4';
  const CURRENT_SCHEMA='22';
  const originalParseReport=parseReport;
  const originalLoadReport=loadReport;

  function finite(v){return Number.isFinite(Number(v))}
  function nval(v){const n=num(v);return Number.isFinite(n)?n:NaN}
  function cleanCompanyName(value){return txt(value).replace(/\[?PDF\]?/ig,'').replace(/\[?Ayarlar\]?/ig,'').replace(/^\s*[|•-]+|[|•-]+\s*$/g,'').trim()}
  function hrefId(raw){
    if(!raw)return '';
    try{const u=new URL(String(raw).replace(/&amp;/g,'&'),absolute(APP.companySource));return u.searchParams.get('FirmaId')||u.searchParams.get('firmaid')||u.searchParams.get('Kimin')||''}catch{}
    const m=String(raw).match(/(?:FirmaId|firmaid|Kimin)\D{0,12}(\d{1,12})/i);return m?m[1]:'';
  }
  function hrefMonthYear(raw){
    try{const u=new URL(String(raw).replace(/&amp;/g,'&'),absolute(APP.companySource));return {month:Number(u.searchParams.get('ay')),year:Number(u.searchParams.get('yil'))}}catch{return {month:NaN,year:NaN}}
  }
  function absoluteOverviewHref(raw){try{return new URL(String(raw).replace(/&amp;/g,'&'),absolute(APP.companySource)).href}catch{return ''}}
  function findOverviewHeader(doc){
    const rows=[...doc.querySelectorAll('tr')];
    for(const row of rows){
      const cells=[...row.cells],heads=cells.map(c=>norm(c.innerText||c.textContent));
      if(!heads.some(h=>h.includes('FIRMA'))||!heads.some(h=>h.includes('AYLIK')))continue;
      const monthly=heads.findIndex(h=>h.includes('AYLIK'));
      let ind=-1,cap=-1;
      for(let i=monthly+1;i<heads.length;i++){
        if(heads[i].includes('SON 2'))break;
        if(ind<0&&/^IND\b|INDUKTIF/.test(heads[i]))ind=i;
        else if(cap<0&&/^KAP\b|KAPASITIF/.test(heads[i]))cap=i;
      }
      if(monthly>=0&&ind>=0&&cap>=0)return {monthly,ind,cap};
    }
    return {monthly:4,ind:5,cap:6};
  }

  parseCompanies=function(html){
    const doc=new DOMParser().parseFromString(html||'','text/html');
    const pos=findOverviewHeader(doc),map=new Map();
    const add=(row,link)=>{
      const cells=[...row.cells];if(!cells.length)return;
      const raw=link?.getAttribute('href')||link?.getAttribute('data-href')||link?.getAttribute('data-url')||'';
      const id=hrefId(raw);if(!id)return;
      const name=cleanCompanyName(link?.getAttribute('title')||link?.textContent||cells[0].textContent);if(!name||/^(FIRMA|SIRKET)$/.test(norm(name)))return;
      const href=absoluteOverviewHref(raw)||new URL('/Aylik_Liste.aspx?FirmaId='+encodeURIComponent(id)+'&ftext='+encodeURIComponent(name),APP.base+'/').href;
      const my=hrefMonthYear(href);
      const monthlyInd=cells[pos.ind]?nval(cells[pos.ind].innerText||cells[pos.ind].textContent):NaN;
      const monthlyCap=cells[pos.cap]?nval(cells[pos.cap].innerText||cells[pos.cap].textContent):NaN;
      const monthlyPeriod=cells[pos.monthly]?txt(String(cells[pos.monthly].innerHTML||'').replace(/<br\s*\/?\s*>/gi,' – ')):'';
      map.set(String(id),{id:String(id),name,href,devices:1,active:true,monthlyInd,monthlyCap,monthlyPeriod,summaryMonth:my.month,summaryYear:my.year});
    };
    doc.querySelectorAll('tr').forEach(row=>{
      const first=row.cells&&row.cells[0];if(!first)return;
      const link=[...first.querySelectorAll('a[href],a[data-href],a[data-url]')].find(a=>/Aylik_?Liste\.aspx/i.test(a.getAttribute('href')||a.getAttribute('data-href')||a.getAttribute('data-url')||''))||[...first.querySelectorAll('a[href],a[data-href],a[data-url]')].find(a=>{const t=cleanCompanyName(a.textContent);return t&&!/^(PDF|AYARLAR)$/i.test(t)});
      if(link)add(row,link);
    });
    if(!map.size){
      doc.querySelectorAll('a[href*="Aylik_Liste.aspx"],a[href*="Aylik_Liste"]' ).forEach(link=>{const row=link.closest('tr');if(row)add(row,link)});
    }
    return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name,'tr'));
  };

  function overviewMatches(company,month,year){
    if(!company)return false;
    if(finite(company.summaryMonth)&&finite(company.summaryYear))return Number(company.summaryMonth)===Number(month)&&Number(company.summaryYear)===Number(year);
    const now=new Date();return now.getMonth()+1===Number(month)&&now.getFullYear()===Number(year);
  }
  function applyOverview(report,company,month,year){
    if(!report)return report;
    if(overviewMatches(company,month,year)){
      if(finite(company.monthlyInd))report.indRatio=Number(company.monthlyInd);
      if(finite(company.monthlyCap))report.capRatio=Number(company.monthlyCap);
      report.ratioSource='admin/ozet.aspx';
      report.monthlyPeriod=company.monthlyPeriod||'';
    }
    return report;
  }

  function numericCells(row){return [...row.cells].map(c=>nval(c.innerText||c.textContent))}
  function validPhase(values){return Array.isArray(values)&&values.some(Number.isFinite)}
  function mergePhase(target,values){for(let i=0;i<3;i++)if(Number.isFinite(values[i]))target[i]=values[i]}
  function extractElectrical(html,report){
    const doc=new DOMParser().parseFromString(html||'','text/html');
    const out={v:[NaN,NaN,NaN],a:[NaN,NaN,NaN],active:[NaN,NaN,NaN],reactive:[NaN,NaN,NaN],cos:[NaN,NaN,NaN],frequency:NaN,totalActive:NaN};
    const tables=[...doc.querySelectorAll('table')];
    for(const table of tables){
      const rows=[...table.rows];if(!rows.length)continue;
      for(let hi=0;hi<Math.min(3,rows.length);hi++){
        const headers=[...rows[hi].cells].map(c=>norm(c.innerText||c.textContent));
        const l1=headers.findIndex(h=>/^L?1$|FAZ 1|R FAZI/.test(h));
        const l2=headers.findIndex(h=>/^L?2$|FAZ 2|S FAZI/.test(h));
        const l3=headers.findIndex(h=>/^L?3$|FAZ 3|T FAZI/.test(h));
        if(l1>=0&&l2>=0&&l3>=0){
          for(const row of rows.slice(hi+1)){
            const cells=[...row.cells],label=norm(cells[0]?.innerText||cells[0]?.textContent||'');
            const vals=[l1,l2,l3].map(i=>cells[i]?nval(cells[i].innerText||cells[i].textContent):NaN);
            if(/AKIM|CURRENT/.test(label))mergePhase(out.a,vals);
            else if(/GERILIM|VOLT/.test(label))mergePhase(out.v,vals);
            else if(/AKTIF.*GUC|ACTIVE.*POWER|KW/.test(label))mergePhase(out.active,vals);
            else if(/REAKTIF.*GUC|REACTIVE.*POWER|KVAR/.test(label))mergePhase(out.reactive,vals);
            else if(/COS|GUC.*FAKTOR|POWER.*FACTOR/.test(label))mergePhase(out.cos,vals);
          }
        }
        const locate=(phase,kind)=>headers.findIndex(h=>{const pr=new RegExp(`(?:^|\\b)(?:${phase})(?:\\b|$)`),kr=new RegExp(kind);return pr.test(h)&&kr.test(h)});
        const firstData=rows[hi+1];
        if(firstData){
          const vals=numericCells(firstData);
          const groups=[['v','L1|R','GERILIM|VOLT'],['a','L1|R','AKIM|CURRENT'],['active','L1|R','AKTIF.*GUC|ACTIVE.*POWER'],['reactive','L1|R','REAKTIF.*GUC|REACTIVE.*POWER']];
          for(const [key,p1,kind] of groups){
            const i1=locate(p1,kind),i2=locate('L2|S',kind),i3=locate('L3|T',kind);
            if(i1>=0||i2>=0||i3>=0)mergePhase(out[key],[vals[i1],vals[i2],vals[i3]]);
          }
          const total=headers.findIndex(h=>/TOPLAM.*AKTIF.*GUC|TOTAL.*ACTIVE.*POWER/.test(h));if(total>=0&&Number.isFinite(vals[total]))out.totalActive=vals[total];
          const freq=headers.findIndex(h=>/FREKANS|FREQUENCY|HZ/.test(h));if(freq>=0&&Number.isFinite(vals[freq]))out.frequency=vals[freq];
        }
      }
      // Rows with phase in the first column and measurement types across columns.
      const header=[...rows[0].cells].map(c=>norm(c.innerText||c.textContent));
      const vi=header.findIndex(h=>/GERILIM|VOLT/.test(h)),ai=header.findIndex(h=>/AKIM|CURRENT/.test(h)),pi=header.findIndex(h=>/AKTIF.*GUC|ACTIVE.*POWER|^KW$/.test(h));
      if(vi>=0||ai>=0||pi>=0){
        rows.slice(1).forEach(row=>{const label=norm(row.cells[0]?.innerText||row.cells[0]?.textContent||'');const phase=/L?1|R FAZI/.test(label)?0:/L?2|S FAZI/.test(label)?1:/L?3|T FAZI/.test(label)?2:-1;if(phase<0)return;if(vi>=0)out.v[phase]=nval(row.cells[vi]?.innerText||row.cells[vi]?.textContent);if(ai>=0)out.a[phase]=nval(row.cells[ai]?.innerText||row.cells[ai]?.textContent);if(pi>=0)out.active[phase]=nval(row.cells[pi]?.innerText||row.cells[pi]?.textContent)});
      }
    }
    const nodes=[...doc.querySelectorAll('input[value],td,th,span,div,label')];
    const pairs=new Map();
    nodes.forEach(el=>{const key=norm((el.getAttribute&&((el.getAttribute('name')||'')+' '+(el.getAttribute('id')||'')))+' '+(el.innerText||el.textContent||''));const value=el.value||el.getAttribute?.('data-value')||el.innerText||el.textContent||'';if(key&&key.length<90&&Number.isFinite(nval(value)))pairs.set(key,nval(value))});
    function pair(re){for(const [k,v] of pairs)if(re.test(k))return v;return NaN}
    for(let p=1;p<=3;p++){
      const ix=p-1;
      if(!Number.isFinite(out.v[ix]))out.v[ix]=pair(new RegExp(`(?:\\bL?${p}\\b|FAZ\\s*${p}\\b).*(?:GERILIM|VOLT)|(?:GERILIM|VOLT).*(?:\\bL?${p}\\b|FAZ\\s*${p}\\b)`));
      if(!Number.isFinite(out.a[ix]))out.a[ix]=pair(new RegExp(`(?:\\bL?${p}\\b|FAZ\\s*${p}\\b).*(?:AKIM|CURRENT)|(?:AKIM|CURRENT).*(?:\\bL?${p}\\b|FAZ\\s*${p}\\b)`));
      if(!Number.isFinite(out.active[ix]))out.active[ix]=pair(new RegExp(`(?:\\bL?${p}\\b|FAZ\\s*${p}\\b).*(?:AKTIF.*GUC|ACTIVE.*POWER)|(?:AKTIF.*GUC|ACTIVE.*POWER).*(?:\\bL?${p}\\b|FAZ\\s*${p}\\b)`));
    }
    if(!Number.isFinite(out.totalActive))out.totalActive=pair(/TOPLAM.*AKTIF.*GUC|TOTAL.*ACTIVE.*POWER/);
    if(!Number.isFinite(out.frequency))out.frequency=pair(/FREKANS|FREQUENCY/);
    if(!validPhase(out.active)&&validPhase(out.v)&&validPhase(out.a)){
      out.active=out.v.map((v,i)=>Number.isFinite(v)&&Number.isFinite(out.a[i])?v*out.a[i]/1000:NaN);
      out.estimatedActive=true;
    }
    if(validPhase(out.v))report.current.v=out.v;
    if(validPhase(out.a))report.current.a=out.a;
    if(validPhase(out.active))report.current.active=out.active;
    if(validPhase(out.reactive))report.current.reactive=out.reactive;
    if(validPhase(out.cos))report.current.cos=out.cos;
    if(Number.isFinite(out.frequency))report.current.frequency=out.frequency;
    report.current.totalActive=Number.isFinite(out.totalActive)?out.totalActive:((report.current.active||[]).filter(Number.isFinite).length?(report.current.active||[]).filter(Number.isFinite).reduce((a,b)=>a+b,0):NaN);
    report.current.activeEstimated=!!out.estimatedActive;
    report.avgV=average(report.current.v||[]);report.avgA=average(report.current.a||[]);
    report.activePower=Number.isFinite(report.current.totalActive)?report.current.totalActive:(validPhase(report.current.active)?(report.current.active.filter(Number.isFinite).reduce((a,b)=>a+b,0)):report.activePower);
    return report;
  }

  parseReport=function(html,company,month,year,url){
    const report=originalParseReport(html,company,month,year,url);
    extractElectrical(html,report);
    return applyOverview(report,company,month,year);
  };
  loadReport=async function(company,month,year,allowRendered=false){
    const report=await originalLoadReport(company,month,year,allowRendered);
    return applyOverview(report,company,month,year);
  };

  function ratioColor(value,limit){return value>=limit?'var(--red)':value>=limit*.8?'var(--orange)':'var(--green)'}
  function overviewValue(value){return finite(value)?'%'+fmt(Number(value),3):'—'}
  function overviewChip(kind,value,limit){const cls=finite(value)&&Number(value)<limit?'safe':'',type=/KAP/i.test(kind)?'cap':'ind';return `<span class="overview-ratio ${type} ${cls}"><span>${kind}</span><b>${overviewValue(value)}</b></span>`}
  companyRows=function(list){
    if(!list.length)return '<div class="empty">Şirket bulunamadı.</div>';
    const visible=list.slice(0,APP.companyLimit);
    const rows=visible.map(c=>`<section class="card company company-card" onclick="openCompany('${encodeURIComponent(c.id)}')"><span class="company-avatar">${esc(initials(c.name))}</span><div class="company-copy"><div class="strong">${esc(c.name)}</div><div class="company-meta"><span>Firma ID: ${esc(c.id)}</span><span class="status">Aktif</span></div>${c.monthlyPeriod?`<div class="company-period">Aylık dönem: ${esc(c.monthlyPeriod)}</div>`:''}</div><div class="company-overview-ratios">${overviewChip('İND',c.monthlyInd,APP.settings.indLimit)}${overviewChip('KAP',c.monthlyCap,APP.settings.capLimit)}</div><span class="chev">${icon('chevron')}</span></section>`).join('');
    return rows+(visible.length<list.length?`<button class="btn btn-soft btn-block load-more" onclick="loadMoreCompanies()">Daha Fazla Göster (${list.length-visible.length})</button>`:'');
  };
  showCompanies=function(){APP.report=null;APP.filtered=[...APP.companies];APP.companyLimit=60;app.innerHTML=`${topBar(APP.role==='admin'?'Tüm Şirketler':'Şirketlerim',false)}${offlineBar()}<main class="page"><div class="search-shell">${icon('search')}<input class="input" id="search" placeholder="Şirket ara..." oninput="filterCompanies(this.value)"><button class="btn btn-soft" aria-label="Yenile" onclick="refreshCompanies()">${icon('refresh')}</button></div><div class="list-meta"><div><b id="companyCount">${APP.filtered.length} şirket</b><div class="sub">Aylık İND/KAP değerleri /admin/ozet.aspx sayfasından</div></div><span class="pill redp">Canlı Liste</span></div><div id="companyList">${companyRows(APP.filtered)}</div></main>`};
  refreshCompanies=async function(){
    toast('Şirket listesi ve aylık oranlar yenileniyor...');
    try{
      let companies=[];
      try{const rendered=await loadRenderedCompanyPage(absolute(APP.companySource));companies=parseCompanies(rendered.text||'')}catch{}
      if(!companies.length)companies=await getCompaniesFrom(APP.companySource);
      if(companies.length){APP.companies=companies;APP.filtered=[...companies];cacheCompanies();showCompanies();toast('Liste ve aylık oranlar yenilendi.')}else toast('Şirket listesi okunamadı.');
    }catch(e){toast(e.message)}
  };

  function ratioRingV21(label,value,limit,energy,unit){
    const safe=finite(value)?Number(value):0,p=Math.min(100,Math.max(0,safe/limit*100)),color=ratioColor(safe,limit);
    return `<article class="ratio-ring-card"><span class="sub">${esc(label)}</span><div class="ratio-ring" style="--ring-p:${p};--ring-color:${color}"><div class="ratio-ring-inner"><b>%${fmt(safe,3)}</b></div></div>${finite(energy)?`<small>${fmt(Number(energy),3)} ${esc(unit)}</small>`:''}<div class="limit-note">Limit: %${limit}</div></article>`;
  }
  monthlyRings=function(r){return `<div class="ratio-rings">${ratioRingV21('Aylık İndüktif',r.indRatio,APP.settings.indLimit,r.current.indKvarh,'kvarh')}${ratioRingV21('Aylık Kapasitif',r.capRatio,APP.settings.capLimit,r.current.capKvarh,'kvarh')}</div><div class="source-note">Oran kaynağı: ${r.ratioSource==='admin/ozet.aspx'?'/admin/ozet.aspx — Aylık sütunundan sonraki İND ve KAP':'aylık rapor'}</div>`};
  gaugeHtml=function(){return APP.report?monthlyRings(APP.report):''};

  function metric(label,value,unit,note,digits=2){return `<article class="electrical-card"><span>${esc(label)}</span><b>${finite(value)?fmt(Number(value),digits)+' '+unit:'—'}</b><small>${esc(note)}</small></article>`}
  function phaseCells(values,digits){return [0,1,2].map(i=>`<td class="${finite(values?.[i])?'':'missing'}">${finite(values?.[i])?fmt(Number(values[i]),digits):'—'}</td>`).join('')}
  currentTab=function(r){
    const c=r.current||{},has=validPhase(c.a)||validPhase(c.v)||validPhase(c.active);
    if(!has)return `<div class="electrical-empty"><b>Akım / gerilim verisi henüz okunamadı.</b><div class="sub" style="margin-top:7px">Sayfa yeniden yüklendiğinde L1–L3 gerilim, akım ve aktif güç değerleri aranacaktır. Nokta dizileri veri olarak gösterilmez.</div></div><button class="btn btn-primary btn-block" onclick="reloadCurrent()">${icon('refresh')} Yeniden Oku</button>`;
    const totalActive=finite(c.totalActive)?Number(c.totalActive):(validPhase(c.active)?c.active.filter(Number.isFinite).reduce((a,b)=>a+b,0):r.activePower);
    return `<div class="electrical-grid">${metric('Ort. Gerilim',r.avgV,'V','L1–L3 ortalaması')}${metric('Ort. Akım',r.avgA,'A','L1–L3 ortalaması')}${metric('Aktif Güç',totalActive,'kW',c.activeEstimated?'Gerilim ve akımdan hesaplandı':'Sunucudan okundu')}</div><article class="current-card"><table class="phase-table"><thead><tr><th></th><th>L1</th><th>L2</th><th>L3</th></tr></thead><tbody><tr class="phase-accent"><td>Gerilim (V)</td>${phaseCells(c.v,2)}</tr><tr class="phase-accent"><td>Akım (A)</td>${phaseCells(c.a,2)}</tr><tr><td>Aktif Güç (kW)</td>${phaseCells(c.active,3)}</tr></tbody></table></article>${warningHtml(r)}<button class="btn btn-soft btn-block" onclick="reloadCurrent()">${icon('refresh')} Değerleri Yenile</button>`;
  };
  dailyTab=function(r){
    const active=finite(r.current?.totalActive)?r.current.totalActive:r.activePower;
    return `<div class="monthly-note"><b>${MONTHS[r.month-1]} ${r.year} aylık özeti</b><br>Aylık İND ve KAP oranları özet sayfasındaki Aylık sütunundan sonraki değerlerdir.</div><div class="electrical-grid">${metric('Ort. Gerilim',r.avgV,'V','L1–L3 ortalaması')}${metric('Ort. Akım',r.avgA,'A','L1–L3 ortalaması')}${metric('Aktif Güç',active,'kW','Anlık / son ölçüm')}</div>${monthlyRings(r)}${warningHtml(r)}${finite(r.current?.kwh)?`<article class="bigmetric"><span class="sub">Aylık Aktif Enerji</span><b>${fmt(r.current.kwh,3)} kWh</b></article>`:''}<div class="small-actions export-actions"><button class="btn btn-soft btn-sm" onclick="showTableReport()">Aylık Tablo</button><button class="btn btn-soft btn-sm" onclick="exportExcel()">${icon('excel')} Excel</button><button class="btn btn-soft btn-sm" onclick="exportPdf()">${icon('pdf')} PDF</button></div>`;
  };
  reactiveTab=function(r){return `<div class="monthly-note"><b>Aylık reaktif görünüm</b><br>Yalnızca aylık indüktif ve kapasitif oranlar gösterilir.</div>${monthlyRings(r)}${warningHtml(r)}<div class="small-actions export-actions"><button class="btn btn-soft btn-sm" onclick="exportExcel()">${icon('excel')} Excel</button><button class="btn btn-soft btn-sm" onclick="exportPdf()">${icon('pdf')} PDF</button></div>`};

  openCompany=async function(enc){
    const id=decodeURIComponent(enc),c=APP.companies.find(x=>String(x.id)===id);if(!c)return;
    APP.dailyLimit=12;APP.current=c;APP.report=null;loading(c.name+' aylık raporu okunuyor...');
    try{APP.report=await loadReport(c,APP.month,APP.year,true);saveReportCache(APP.report);checkReportAlert(c,APP.report,true);showDevice('daily')}
    catch(e){const cached=getReportCache(c.id,APP.month,APP.year);if(cached){APP.report=applyOverview(cached,c,APP.month,APP.year);toast('Bağlantı kurulamadı; kayıtlı rapor gösteriliyor.');showDevice('daily')}else app.innerHTML=`${topBar('Enerji Raporu')}<main class="page"><section class="card center"><h2>Rapor okunamadı</h2><p class="sub">${esc(e.message)}</p><div class="sub" style="margin-top:10px">Rapor: /Aylik_Liste.aspx?FirmaId=${esc(c.id)}&amp;ay=${APP.month}&amp;yil=${APP.year}</div><button class="btn btn-primary" style="margin-top:16px" onclick="openCompany('${encodeURIComponent(id)}')">Tekrar Dene</button></section></main>`}
  };
  showDevice=function(tab=APP.tab){
    if(!APP.report)return showCompanies();APP.tab=tab;const r=APP.report,c=r.company;
    const title=tab==='daily'?'Aylık Enerji Özeti':tab==='current'?'Akım–Gerilim Raporu':'Aylık Reaktif Rapor';
    app.innerHTML=`${topBar(title)}${offlineBar()}<main class="page"><section class="device-card"><div class="device-company-row"><span class="company-avatar">${esc(initials(c.name))}</span><div><div class="device-title">${esc(c.name)}</div><div class="company-meta"><span class="status">Aktif</span><span>Firma ID ${esc(c.id)}</span></div></div></div><div class="meta-grid"><div><span class="meta-label">Rapor Dönemi</span><strong class="meta-value">${MONTHS[r.month-1]} ${r.year}</strong></div><div><span class="meta-label">Kayıt Sayısı</span><strong class="meta-value">${r.records.length}</strong></div></div></section><section class="thin-info"><span>İndüktif Limit: <b>%${APP.settings.indLimit}</b></span><span>Kapasitif Limit: <b>%${APP.settings.capLimit}</b></span></section><nav class="tabs" aria-label="Rapor tipi"><button class="tab ${tab==='daily'?'active':''}" onclick="showDevice('daily')">Aylık Özet</button><button class="tab ${tab==='current'?'active':''}" onclick="showDevice('current')">Akım / Gerilim</button><button class="tab ${tab==='reactive'?'active':''}" onclick="showDevice('reactive')">Reaktif</button></nav><section class="monthbar"><button class="btn btn-sm" onclick="changeMonth(-1)">‹ Önceki</button><div class="monthpick">${MONTHS[r.month-1]} ${r.year}</div><button class="btn btn-sm" onclick="changeMonth(1)">Sonraki ›</button></section>${deviceTab(r,tab)}</main>`;
  };

  showLogin=function(){APP.report=null;app.innerHTML=`${offlineBar()}<main class="login-wrap"><section class="login-hero"><img src="ets_logo.png" class="ets-logo login-logo" alt="ETS"><h1>ETS Enerji Takip</h1><p>Enerji Takip Sistemi</p></section><section class="card login-panel"><h2>Sisteme Hoş Geldiniz</h2><div class="sub login-help">Giriş yapmak için kullanıcı bilgilerinizi giriniz.</div><div class="login-field">${icon('companies')}<input id="user" class="input" autocomplete="username" value="${esc(localStorage.getItem('etm_user')||'')}" placeholder="Kullanıcı adı"></div><div class="login-field">${icon('settings')}<input id="pass" class="input" type="password" autocomplete="current-password" placeholder="Parola"></div><label class="check"><input id="remember" type="checkbox" ${localStorage.getItem('etm_user')?'checked':''}> Beni Hatırla</label><div class="login-actions"><button id="loginBtn" class="btn btn-primary btn-block" onclick="doLogin()">Giriş Yap</button></div><div id="loginError" class="sub red center" style="margin-top:12px"></div></section><div class="version">Sürüm ${VERSION} • 2026</div></main>`};
  showAbout=function(){app.innerHTML=`${topBar('Hakkında',false)}<main class="page"><img src="ets_logo.png" class="ets-logo about-logo-img" alt="ETS"><div class="center strong" style="font-size:20px">Enerji Takip Sistemi</div><section class="card" style="margin-top:23px"><h3>Uygulama Hakkında</h3><p class="sub" style="font-size:14px">Bu uygulama /admin/ozet.aspx sayfasındaki aylık İND/KAP oranlarını, aylık enerji raporlarını ve akım-gerilim değerlerini gösterir.</p><hr style="border:0;border-top:1px solid #eee"><div class="row between"><span>Sürüm</span><b>${VERSION}</b></div><div class="row between" style="margin-top:12px"><span>Web Sitesi</span><b>www.etm.com.tr</b></div></section><div class="center sub">Uygulama ETM Mühendislik için hazırlanmıştır.</div></main>`};

  if(localStorage.getItem('etm_overview_schema')!==CURRENT_SCHEMA){localStorage.removeItem('etm_companies');localStorage.removeItem('etm_logged');localStorage.setItem('etm_overview_schema',CURRENT_SCHEMA);APP.companies=[];APP.filtered=[];APP.logged=false;}
  APP.logged=false;showLogin();
})();
</script>

<script>
(function(){
  var bootStarted=Date.now();
  function scheduleBootHide(){var remaining=Math.max(0,2000-(Date.now()-bootStarted));setTimeout(function(){var b=document.getElementById('nativeBoot');if(b){b.style.opacity='0';b.style.transition='opacity .28s ease';setTimeout(function(){if(b)b.remove();},300);}},remaining);}
  document.addEventListener('DOMContentLoaded',scheduleBootHide);
  window.addEventListener('load',scheduleBootHide);
  window.addEventListener('error',function(e){
    var b=document.getElementById('nativeBoot');
    if(b){b.innerHTML='<div style="font-family:Arial;text-align:center;background:#fff;padding:28px;border-radius:20px;width:88%;max-width:360px"><div style="font-size:54px;font-weight:900;color:#d51f26">ETS</div><h3>Uygulama açıldı</h3><p style="color:#666">Arayüz yüklenirken hata oluştu. Uygulamayı kapatıp tekrar açın.</p></div>'; }
  });
})();
</script>
