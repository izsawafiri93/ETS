let nativeRequestSeq=0;
const nativePending=new Map();
window.onNativeHttpResult=function(id,raw){
  const pending=nativePending.get(id);if(!pending)return;
  nativePending.delete(id);clearTimeout(pending.timer);
  try{pending.resolve(JSON.parse(raw))}catch(e){pending.reject(new Error('Sunucu yanıtı okunamadı'))}
};
function nativeRequest(method,url,body,contentType){
  return new Promise((resolve,reject)=>{
    const id=++nativeRequestSeq;
    const timer=setTimeout(()=>{nativePending.delete(id);reject(new Error('Bağlantı zaman aşımına uğradı'))},65000);
    nativePending.set(id,{resolve,reject,timer});
    try{window.AndroidHttp.requestAsync(id,method,url,body,contentType)}catch(e){clearTimeout(timer);nativePending.delete(id);reject(e)}
  });
}
async function fetchText(path,options={}){
  const requestedUrl=path.startsWith('http')?path:absolute(path);const url=String(options.method||'GET').toUpperCase()==='GET'?(()=>{const u=new URL(requestedUrl);u.searchParams.set('_ets_refresh',String(Date.now())+'_'+Math.random().toString(36).slice(2));return u.href})():requestedUrl;
  // On Android use the native HTTP bridge. It keeps the ASP.NET session cookie
  // across login and /admin/ozet.aspx and is not affected by file:// CORS rules.
  if(window.AndroidHttp&&typeof window.AndroidHttp.request==='function'){
    try{
      const method=String(options.method||'GET').toUpperCase();
      const contentType=(options.headers&&options.headers['Content-Type'])||'';
      const result=await nativeRequest(method,url,String(options.body||''),contentType);
      if(result.error)throw new Error(result.error);
      if(result.status>=400)throw new Error('Sunucu yanıtı: '+result.status);
      return {text:result.text||'',url:result.url||url,status:Number(result.status||0)};
    }catch(e){throw new Error(e.message||'Bağlantı kurulamadı');}
  }
  const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),30000);
  try{
    const r=await fetch(url,{credentials:'include',cache:'no-store',redirect:'follow',signal:controller.signal,...options});
    const text=await r.text();if(!r.ok&&r.status!==0)throw new Error('Sunucu yanıtı: '+r.status);return {text,url:r.url||url,status:r.status};
  }catch(e){throw new Error(e.name==='AbortError'?'Bağlantı zaman aşımına uğradı':(e.message||'Bağlantı kurulamadı'));}finally{clearTimeout(timer)}
}
let renderedCompanyWaiter=null;
window.onNativeCompanyPage=function(raw){
  let payload=raw;try{if(typeof payload==='string')payload=JSON.parse(payload)}catch{}
  if(!renderedCompanyWaiter)return;
  const waiter=renderedCompanyWaiter;renderedCompanyWaiter=null;clearTimeout(waiter.timer);
  if(payload&&payload.error)return waiter.reject(new Error(payload.error));
  try{if(payload&&payload.htmlBase64)payload.text=decodeURIComponent(escape(atob(payload.htmlBase64)));else if(payload)payload.text=payload.text||''}catch{if(payload)payload.text=''}
  waiter.resolve(payload||{});
};
function loadRenderedCompanyPage(url){

}

function formFields(doc){const p=new URLSearchParams();doc.querySelectorAll('input[name]').forEach(i=>{if((i.type==='hidden'||i.type==='submit')&&i.value)p.set(i.name,i.value)});return p}
function findName(doc,suffix){const el=[...doc.querySelectorAll('[name]')].find(x=>x.name===suffix||x.name.endsWith('$'+suffix)||x.id===suffix||x.id.endsWith('_'+suffix));return el?.name||suffix}

function resetAccountData(){
  clearInterval(APP.monitorTimer);APP.monitorTimer=null;
  APP.logged=false;APP.role='';APP.companies=[];APP.filtered=[];APP.current=null;APP.report=null;
  APP.alerts=[];APP.monthly=[];APP.forecast=[];APP.pendingPdf=null;

function loginThroughWebsite(user,pass,remember){
  if(!(window.AndroidHttp&&typeof window.AndroidHttp.loginWithWebView==='function'))return null;

async function login(user,pass,remember){
  let out;
  const nativeLogin=loginThroughWebsite(user,pass,remember);
  if(nativeLogin)out=await nativeLogin;
  else{
    const first=await fetchText('/User/GirisYap.aspx');const doc=new DOMParser().parseFromString(first.text,'text/html');const body=formFields(doc);
    body.set(findName(doc,'TbKullaniciAdi'),user);body.set(findName(doc,'TbParola'),pass);if(remember)body.set(findName(doc,'Cb1'),'on');
    const button=[...doc.querySelectorAll('input[type=submit][name],button[name]')].find(x=>/Giris/i.test(x.name)||/Giriş|Giris/i.test(x.value||x.textContent));if(button)body.set(button.name,button.value||'Giriş');
    out=await fetchText('/User/GirisYap.aspx',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body.toString()});
  }
  if(/Yanlış kullanc|Yanlis kullanc|Kullanıcı Adı ve parola/i.test(out.text))throw new Error('Kullanıcı adı veya parola yanlış.');
  const finalPath=new URL(out.url||'/User/GirisYap.aspx',APP.base+'/').pathname.toLowerCase();
  if(finalPath.includes('girisyap.aspx'))throw new Error('Giriş doğrulanamadı. Kullanıcı adı ve parolayı kontrol edin.');
  if(finalPath.startsWith('/default.aspx')||finalPath.startsWith('/gruplar.aspx')){APP.role='user';APP.logged=true;APP.companies=[];APP.filtered=[];localStorage.setItem('etm_user',remember?user:'');localStorage.removeItem('etm_logged');window.AndroidHttp?.openUserPortal?.();return true;}
  if(!finalPath.startsWith('/admin'))throw new Error('Beklenmeyen giriş yönlendirmesi: '+finalPath);
  // The server normally redirects the authenticated session to /admin/.
  // The Android bridge now opens /admin/ first, then loads the exact rendered
  // /admin/ozet.aspx page and waits for its JavaScript/DataTables rows to appear.
  const diagnostics=[];let found=[];
  try{
    const rendered=await loadRenderedCompanyPage(absolute(APP.companySource));
    const direct=Array.isArray(rendered.records)?rendered.records.map(r=>({id:String(r.id||''),name:txt(r.name||''),href:r.href||('/Aylik_Liste.aspx?FirmaId='+encodeURIComponent(r.id)+'&ftext='+encodeURIComponent(r.name||'')),devices:1,active:true})).filter(r=>r.id&&r.name):[];
    const parsedPage=parseCompanies(rendered.text||'');
    const page=parsedPage.length?parsedPage:direct;
    diagnostics.push(`${APP.companySource}: rendered DOM, ${page.length} records, ${Number(rendered.totalRows||0)} table rows${rendered.login?', login page returned':''}`);
    if(page.length){found=page;APP.role='admin'}
  }catch(e){diagnostics.push(`${APP.companySource}: rendered DOM error: ${e.message}`)}

  const probes=[
    {path:APP.companySource,role:'admin'},
    {path:out.url||'/admin/',html:out.text,role:'admin'},
    {path:'/Admin/Ozet.aspx',role:'admin'}
  ];
  for(const probe of probes){
    if(found.length)break;
    try{
      const result=probe.html?{text:probe.html,url:probe.path,status:200}:await fetchText(probe.path);
      const page=parseCompanies(result.text);
      const pd=new DOMParser().parseFromString(result.text,'text/html');
      const isLogin=!!pd.querySelector('input[name*=TbKullaniciAdi],input[id*=TbKullaniciAdi]')||/Kullanıcı Adı ve parola|Giriş Yap/i.test(txt(pd.body?.textContent||''));
      const title=txt(pd.title||'').slice(0,50);
      diagnostics.push(`${probe.path}: static HTTP ${result.status}, ${page.length} records${isLogin?', login page returned':''}${title?', '+title:''}`);
      if(page.length){found=page;APP.role=probe.role;break;}
    }catch(e){diagnostics.push(`${probe.path}: ${e.message}`)}
  }
  APP.role='admin';APP.companies=found;APP.logged=true;APP.filtered=[...found];
  localStorage.setItem('etm_user',remember?user:'');localStorage.setItem('etm_logged','1');
  cacheCompanies();startMonitor();
  if(!found.length)console.warn('Giriş başarılı; şirket listesi boş veya alınamadı:',diagnostics.join(' | '));
  return true;
}
function parseCompanies(html){
  const doc=new DOMParser().parseFromString(html,'text/html'),map=new Map();
  const cleanName=s=>txt(s).replace(/\[?PDF\]?/ig,'').replace(/\[?Ayarlar\]?/ig,'').replace(/^\s*[|•-]+|[|•-]+\s*$/g,'').trim();
  const idFromRaw=raw=>{
    if(!raw)return '';
    const value=String(raw).replace(/&amp;/g,'&').replace(/\\u0026/g,'&');
    try{const u=new URL(value,APP.base+'/');for(const [k,v] of u.searchParams){if(/^(FirmaId|FirmaID|firmaid|Kimin|kimin|Firma|firma|fid|id|SayacId|sayacid|SirketId|sirketid|MusteriId|musteriid|AboneId|aboneid|no)$/i.test(k)&&/^\d{1,12}$/.test(v))return v}}catch{}
    const m=value.match(/(?:FirmaId|FirmaID|firmaid|Kimin|kimin|fid|SayacId|SirketId|MusteriId|AboneId|firma|id|no)\D{0,20}(\d{1,12})/i)||value.match(/__doPostBack\([^)]*?['"](\d{1,12})['"]/i);
    return m?m[1]:'';
  };
  const absoluteHref=raw=>{
    if(!raw||/^javascript:|^#$/i.test(String(raw).trim()))return '';
    try{return new URL(String(raw).replace(/&amp;/g,'&'),absolute(APP.companySource)).href}catch{return ''}
  };
  const score=(href,label)=>{
    const h=String(href||''),t=txt(label);
    let s=0;
    if(/Aylik_?Liste|rapor|detay/i.test(h))s+=8;
    if(t&&!/PDF|Ayarlar/i.test(t))s+=5;
    if(/PDF|Ayarlar|ayar|setting/i.test(h+' '+t))s-=12;
    return s;
  };
  const add=(raw,name='',idHint='')=>{
    const id=String(idHint||idFromRaw(raw)||'').trim();if(!id)return;
    const clean=cleanName(name)||('Şirket '+id);
    let href=absoluteHref(raw);
    if(!href)href=new URL('/Aylik_Liste.aspx?FirmaId='+encodeURIComponent(id)+'&ftext='+encodeURIComponent(clean),APP.base+'/').href;
    const item={id,name:clean,href,settingsHref:new URL('/admin/IsletmeAyarlari.aspx?id='+encodeURIComponent(id),APP.base+'/').href,devices:1,active:true,_score:score(href,name)};
    const prev=map.get(id);
    if(!prev||item._score>prev._score)map.set(id,item);
    else if(prev&&/^Şirket \d+$/.test(prev.name)&&clean)prev.name=clean;
  };

  // Read each company row. The company name link is preferred for the report URL,
  // while PDF/Ayarlar links may still provide the hidden company identifier.
  doc.querySelectorAll('tr').forEach(row=>{
    const cells=[...row.querySelectorAll(':scope > td')];if(!cells.length)return;
    const first=cells[0];
    const links=[...first.querySelectorAll('a,[href],[onclick],[data-href],[data-url]')];
    const companyLink=links.find(el=>{const t=txt(el.textContent);return t&&!/^(?:\[?PDF\]?|\[?Ayarlar\]?|PDF|Ayarlar)$/i.test(t)})||null;
    const name=cleanName(companyLink?.textContent||first.textContent);
    if(!name||/^(FIRMA|ŞİRKET|SIRKET)$/i.test(name))return;
    const rawParts=[];
    row.querySelectorAll('[href],[onclick],[data-href],[data-url],[data-id],[data-firmaid],[data-kimin],[value]').forEach(el=>{
      rawParts.push(el.getAttribute('href'),el.getAttribute('onclick'),el.getAttribute('data-href'),el.getAttribute('data-url'),el.getAttribute('data-id'),el.getAttribute('data-firmaid'),el.getAttribute('data-kimin'),el.getAttribute('value'));
    });
    const id=rawParts.filter(Boolean).map(idFromRaw).find(Boolean)||'';
    const reportRaw=companyLink&&(companyLink.getAttribute('href')||companyLink.getAttribute('data-href')||companyLink.getAttribute('data-url')||companyLink.getAttribute('onclick'));
    if(id)add(reportRaw||'/Aylik_Liste.aspx?FirmaId='+encodeURIComponent(id),name,id);
  });

  // Fallback for pages where the report links are outside normal rows.
  doc.querySelectorAll('a[href],area[href],[data-href],[data-url]').forEach(el=>{
    const label=txt(el.textContent||el.getAttribute('title')||'');
    if(/^(?:\[?PDF\]?|\[?Ayarlar\]?|PDF|Ayarlar)$/i.test(label))return;
    const raw=el.getAttribute('href')||el.getAttribute('data-href')||el.getAttribute('data-url');
    add(raw,label);
  });
  const source=html.replace(/&amp;/g,'&');
  (source.match(/(?:https?:\/\/[^'"<>\s]+|[\/\w.-]*Aylik_?Liste\.aspx\?[^'"<>\s]+)/ig)||[]).forEach(h=>add(h,''));
  return [...map.values()].map(({_score,...item})=>item).sort((a,b)=>a.name.localeCompare(b.name,'tr'));
}

async function openCompany(enc){

  APP.dailyLimit=12;APP.current=c;APP.report=null;loading(c.name+' raporu okunuyor...');

function reportCandidates(company,month,year){
  const out=[],seen=new Set(),push=u=>{try{const href=new URL(u,APP.base+'/').href;if(!seen.has(href)){seen.add(href);out.push(href)}}catch{}};
  if(company.href){
    push(company.href);
    try{
      const dated=new URL(company.href,APP.base+'/');
      dated.searchParams.set('ay',month);dated.searchParams.set('yil',year);
      if(!dated.searchParams.get('ftext'))dated.searchParams.set('ftext',company.name);
      push(dated.href);
    }catch{}
  }
  const roots=['/Aylik_Liste.aspx','/admin/Aylik_Liste.aspx'];
  for(const root of roots){
    for(const key of ['FirmaId','Kimin']){
      const u=new URL(root,APP.base+'/');u.searchParams.set(key,company.id);u.searchParams.set('ay',month);u.searchParams.set('yil',year);u.searchParams.set('ftext',company.name);push(u.href);
    }
  }
  return out;
}
function reportPageState(html){
  const doc=new DOMParser().parseFromString(html||'','text/html');
  const hasPassword=!!doc.querySelector('input[type=password]');
  const hasUser=!!doc.querySelector('input[name*=Kullanici],input[id*=Kullanici],input[name*=TbKullaniciAdi],input[id*=TbKullaniciAdi]');
  const body=txt(doc.body?.textContent||'');
  return {login:hasPassword&&hasUser,denied:/Yetkiniz olmayan|yetkiniz yok|erişim yetkiniz/i.test(body),title:txt(doc.title||'')};
}
function reportHasData(report){
  return !!(report&&(report.records.length||Number.isFinite(report.current.kwh)||report.current.v.some(Number.isFinite)||report.current.a.some(Number.isFinite)));
}
async function loadReport(company,month,year,allowRendered=false){
  const candidates=reportCandidates(company,month,year),diagnostics=[];
  for(const url of candidates){
    try{
      const r=await fetchText(url),state=reportPageState(r.text);
      if(state.login){diagnostics.push(`${new URL(url).pathname}: login page`);continue}
      if(state.denied){diagnostics.push(`${new URL(url).pathname}: permission denied`);continue}
      const parsed=parseReport(r.text,company,month,year,r.url||url);
      if(reportHasData(parsed))return parsed;
      diagnostics.push(`${new URL(url).pathname}: HTTP ${r.status}, report table not found${state.title?' ('+state.title+')':''}`);
    }catch(e){diagnostics.push(`${new URL(url).pathname}: ${e.message}`)}
  }

  if(allowRendered){
    for(const url of candidates.slice(0,3)){
      try{
        const rendered=await loadRenderedReportPage(url),state=reportPageState(rendered.text||'');
        if(rendered.login||state.login){diagnostics.push(`${new URL(url).pathname}: rendered login page`);continue}
        if(rendered.denied||state.denied){diagnostics.push(`${new URL(url).pathname}: rendered permission denied`);continue}
        const parsed=parseReport(rendered.text||'',company,month,year,rendered.url||url);
        if(reportHasData(parsed))return parsed;
        diagnostics.push(`${new URL(url).pathname}: rendered page, report table not found`);
      }catch(e){diagnostics.push(`${new URL(url).pathname}: rendered ${e.message}`)}
    }
  }
  throw new Error('The company link was found, but its energy report could not be read. '+diagnostics.join(' • '));
}
function tableRows(table){return [...table.rows].map(r=>[...r.cells].map(c=>txt(c.innerHTML)))}
function parseReport(html,company,month,year,url){const doc=new DOMParser().parseFromString(html,'text/html');const all=[...doc.querySelectorAll('table')].map(tableRows).filter(r=>r.length);let daily=[];for(const rows of all){const h=norm(rows[0].join(' '));if(h.includes('TARIH')&&h.includes('TOPLAM')&&(h.includes('IND.ORAN')||h.includes('IND ORAN'))){daily=rows;break}}
  let headers=[],records=[];if(daily.length){headers=daily[0].map(norm);for(const row of daily.slice(1)){if(row.length<5)continue;const get=(...keys)=>{let i=headers.findIndex(h=>keys.some(k=>h.includes(k)));return i>=0?row[i]:''};records.push({date:get('TARIH'),max:get('MAX.DEM','MAX DEM'),total:num(get('TOPLAM')),inductive:num(get('INDUKTIF')),capacitive:num(get('KAPASITIF')),activeDiff:num(get('TOP.FARK','TOP FARK')),indDiff:num(get('IND.FARK','IND FARK')),capDiff:num(get('KAP.FARK','KAP FARK')),indRatio:num(get('IND.ORAN','IND ORAN')),capRatio:num(get('KAP.ORAN','KAP ORAN'))});}}
  records=records.filter(r=>r.date&&(!norm(r.date).includes('TOPLAM')));
  let current={kwh:NaN,indKvarh:NaN,capKvarh:NaN,v:[NaN,NaN,NaN],a:[NaN,NaN,NaN],active:[NaN,NaN,NaN],reactive:[NaN,NaN,NaN],cos:[NaN,NaN,NaN],frequency:NaN,powerFactor:NaN};
  for(const rows of all){if(rows.length<2)continue;const h=rows[0].map(norm),joined=h.join(' ');if(joined.includes('KWH')&&(joined.includes('GERILIM')||joined.includes('AKIM'))){const val=rows[1];const at=(...ks)=>{let i=h.findIndex(x=>ks.some(k=>x.includes(k)));return i>=0?num(val[i]):NaN};current.kwh=at('KWH');current.indKvarh=at('IND. KVARH','IND KVARH');current.capKvarh=at('KAP. KVARH','KAP KVARH');current.v=[at('L1 GERILIM'),at('L2 GERILIM'),at('L3 GERILIM')];current.a=[at('L1 AKIM'),at('L2 AKIM'),at('L3 AKIM')];break}}
  const bodyText=txt(doc.body?.innerHTML||html);const imei=(bodyText.match(/IMEI\s*:\s*([A-Z0-9]+)/i)||[])[1]||'';const rawLastRead=(bodyText.match(/Son\s+okuma\s*:\s*([^|]+?)(?:\s{2,}|$)/i)||[])[1]||records.at(-1)?.date||'';const lastRead=readingDateTimeOnly(rawLastRead)||readingDateTimeOnly(records.at(-1)?.date)||'';
  if(records.length){const last=records.at(-1);if(!Number.isFinite(current.kwh))current.kwh=last.total;if(!Number.isFinite(current.indKvarh))current.indKvarh=last.inductive;if(!Number.isFinite(current.capKvarh))current.capKvarh=last.capacitive;}
  let indRatio=records.at(-1)?.indRatio,capRatio=records.at(-1)?.capRatio;const valid=records.filter(r=>Number.isFinite(r.activeDiff)&&r.activeDiff>0);if(!Number.isFinite(indRatio)&&valid.length){const ad=valid.reduce((s,r)=>s+r.activeDiff,0),id=valid.reduce((s,r)=>s+(Number.isFinite(r.indDiff)?r.indDiff:0),0);indRatio=ad?id/ad*100:0}if(!Number.isFinite(capRatio)&&valid.length){const ad=valid.reduce((s,r)=>s+r.activeDiff,0),cd=valid.reduce((s,r)=>s+(Number.isFinite(r.capDiff)?r.capDiff:0),0);capRatio=ad?cd/ad*100:0}
  const avgA=average(current.a),avgV=average(current.v),activePower=Number.isFinite(avgA)&&Number.isFinite(avgV)?avgA*avgV*1.732/1000:NaN;
  return {company,month,year,url,imei,lastRead,current,records,indRatio:Number.isFinite(indRatio)?indRatio:0,capRatio:Number.isFinite(capRatio)?capRatio:0,avgA,avgV,activePower,loadedAt:new Date().toISOString()};
}
function average(a){const v=a.filter(Number.isFinite);return v.length?v.reduce((x,y)=>x+y,0)/v.length:NaN}

function deviceTab(r,tab){if(tab==='current')return currentTab(r);if(tab==='reactive')return reactiveTab(r);return dailyTab(r)}
function dailyTab(r){const latest=r.records.at(-1),shown=r.records.slice().reverse().slice(0,APP.dailyLimit);return `<div class="stats"><article class="stat"><span class="stat-label">Ort. Akım</span><strong class="stat-value">${fmt(r.avgA)} A</strong><small class="stat-note">L1–L3 ortalaması</small></article><article class="stat"><span class="stat-label">Ort. Gerilim</span><strong class="stat-value">${fmt(r.avgV)} V</strong><small class="stat-note">Faz ortalaması</small></article><article class="stat"><span class="stat-label">Aktif Enerji</span><strong class="stat-value">${fmt(latest?.activeDiff,2)} kWh</strong><small class="stat-note">Son günlük fark</small></article></div>${gaugeHtml(r.indRatio,r.capRatio)}${warningHtml(r)}<div class="section-heading"><div><strong>Günlük Kayıtlar</strong><span>Detay için güne dokunun</span></div><span class="pill redp">${r.records.length} gün</span></div>${r.records.length?shown.map((x,i)=>dayHtml(x,r.records.length-i,i===0)).join(''):'<div class="empty">Bu ay için günlük kayıt bulunamadı.</div>'}${shown.length<r.records.length?`<button class="btn btn-soft btn-block" onclick="APP.dailyLimit+=12;showDevice('daily')">Daha Fazla Kayıt Göster</button>`:''}<div class="small-actions export-actions"><button class="btn btn-soft btn-sm" onclick="showTableReport()">Tüm Tablo</button><button class="btn btn-soft btn-sm" onclick="exportExcel()">${icon('excel')} Excel</button><button class="btn btn-soft btn-sm" onclick="exportPdf()">${icon('pdf')} PDF</button></div>`}
function gaugeHtml(ind,cap){const ip=Math.min(100,Math.max(0,ind/APP.settings.indLimit*100)),cp=Math.min(100,Math.max(0,cap/APP.settings.capLimit*100));return `<div class="gauges"><article class="gauge"><span class="sub">İndüktif Oran</span><strong class="gauge-value" style="color:${ind>=APP.settings.indLimit?'var(--red)':'var(--green)'}">% ${fmt(ind)}</strong><div class="progress-meter"><i style="width:${ip}%;background:${ind>=APP.settings.indLimit?'var(--red)':'var(--green)'}"></i></div><div class="limit-note">Uyarı limiti: %${APP.settings.indLimit}</div></article><article class="gauge"><span class="sub">Kapasitif Oran</span><strong class="gauge-value" style="color:${cap>=APP.settings.capLimit?'var(--red)':'var(--green)'}">% ${fmt(cap)}</strong><div class="progress-meter"><i style="width:${cp}%;background:${cap>=APP.settings.capLimit?'var(--red)':'var(--green)'}"></i></div><div class="limit-note">Uyarı limiti: %${APP.settings.capLimit}</div></article></div>`}
function warningHtml(r){const msgs=[];if(r.indRatio>=APP.settings.indLimit)msgs.push(`İndüktif oran %${fmt(r.indRatio)} ile %${APP.settings.indLimit} limitini aştı.`);if(r.capRatio>=APP.settings.capLimit)msgs.push(`Kapasitif oran %${fmt(r.capRatio)} ile %${APP.settings.capLimit} limitini aştı.`);return msgs.length?`<div class="warnbox"><b>⚠</b><div class="grow">${msgs.map(esc).join('<br>')}</div><button class="btn btn-primary btn-sm" onclick="sendWhatsAppCurrent()">WhatsApp</button></div>`:''}
function dayHtml(x,n,open=false){return `<article class="day-card ${open?'open':''}"><button class="day-toggle" type="button" onclick="toggleDayCard(this)"><span class="daynum">${String(n).padStart(2,'0')}</span><span class="day-copy"><span class="day-title"><strong>${esc(x.date)}</strong><span>Günlük sayaç kaydı</span></span><span class="mini-values"><span class="mini">Aktif fark<b>${fmt(x.activeDiff,3)} kWh</b></span><span class="mini">İndüktif<b>% ${fmt(x.indRatio)}</b></span><span class="mini">Kapasitif<b>% ${fmt(x.capRatio)}</b></span></span></span><span class="day-chevron">⌄</span></button><div class="day-details"><div class="detail-kpis"><div><span>Toplam Aktif</span><b>${fmt(x.total,3)} kWh</b></div><div><span>Max. Demand</span><b>${esc(x.max||'—')}</b></div><div><span>İndüktif Enerji</span><b>${fmt(x.inductive,3)} kvarh</b></div><div><span>Kapasitif Enerji</span><b>${fmt(x.capacitive,3)} kvarh</b></div></div><div class="details-footer"><span>İndüktif fark ${fmt(x.indDiff,3)} • Kapasitif fark ${fmt(x.capDiff,3)}</span><button class="btn btn-primary" onclick="event.stopPropagation();showTableReport()">Tüm ölçümler</button></div></div></article>`}
function toggleDayCard(button){const card=button.closest('.day-card');document.querySelectorAll('.day-card.open').forEach(x=>{if(x!==card)x.classList.remove('open')});card.classList.toggle('open')}
function currentTab(r){const c=r.current;return `<div class="section-heading"><div><strong>Anlık Akım ve Gerilim</strong><span>Son güncelleme: ${esc(r.lastRead||'—')}</span></div><span class="status">Canlı veri</span></div><article class="current-card"><div class="instant-time">${esc(r.lastRead||'Son ölçüm')}</div><table class="phase-table"><thead><tr><th></th><th>L1</th><th>L2</th><th>L3</th></tr></thead><tbody><tr class="phase-accent"><td>Akım (A)</td>${c.a.map(x=>`<td>${fmt(x,2)}</td>`).join('')}</tr><tr class="phase-accent"><td>Gerilim (V)</td>${c.v.map(x=>`<td>${fmt(x,2)}</td>`).join('')}</tr><tr><td>Aktif Güç (kW)</td>${(c.active||[]).map(x=>`<td>${fmt(x,3)}</td>`).join('')||'<td>—</td><td>—</td><td>—</td>'}</tr><tr><td>Reaktif Güç</td>${(c.reactive||[]).map(x=>`<td>${fmt(x,3)}</td>`).join('')||'<td>—</td><td>—</td><td>—</td>'}</tr><tr><td>Cos φ</td>${(c.cos||[]).map(x=>`<td>${fmt(x,3)}</td>`).join('')||'<td>—</td><td>—</td><td>—</td>'}</tr></tbody></table></article><div class="reactive-box" style="margin-top:12px"><article class="bigmetric"><span class="sub">Aktif Enerji (1.8.0)</span><b>${fmt(c.kwh,3)} kWh</b></article><article class="bigmetric"><span class="sub">Tahmini Aktif Güç</span><b>${fmt(r.activePower,2)} kW</b></article></div>${gaugeHtml(r.indRatio,r.capRatio)}${warningHtml(r)}<button class="btn btn-soft btn-block" onclick="reloadCurrent()">${icon('refresh')} Değerleri Yenile</button>`}
function phaseRow(v,unit){return `<table class="phase-table"><tr><th></th><th>L1</th><th>L2</th><th>L3</th></tr><tr><td>${unit}</td>${v.map(x=>`<td>${fmt(x,2)}</td>`).join('')}</tr></table>`}
function reactiveTab(r){const rows=r.records.slice().reverse().slice(0,14);return `<div class="reactive-box"><article class="bigmetric"><span class="sub">İndüktif Oran</span><b>% ${fmt(r.indRatio)}</b><div class="progress-meter"><i style="width:${Math.min(100,r.indRatio/APP.settings.indLimit*100)}%"></i></div></article><article class="bigmetric"><span class="sub">Kapasitif Oran</span><b>% ${fmt(r.capRatio)}</b><div class="progress-meter"><i style="width:${Math.min(100,r.capRatio/APP.settings.capLimit*100)}%"></i></div></article></div><div class="reactive-box" style="margin-top:9px"><article class="bigmetric"><span class="sub">İndüktif Enerji</span><b>${fmt(r.current.indKvarh,3)} kvarh</b></article><article class="bigmetric"><span class="sub">Kapasitif Enerji</span><b>${fmt(r.current.capKvarh,3)} kvarh</b></article></div><section class="reactive-list"><table><thead><tr><th>Tarih</th><th>İndüktif</th><th>Kapasitif</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.date)}</td><td>% ${fmt(x.indRatio)}</td><td>% ${fmt(x.capRatio)}</td></tr>`).join('')||'<tr><td colspan="3">Kayıt bulunamadı</td></tr>'}</tbody></table></section>${warningHtml(r)}`}
async function changeMonth(delta){APP.dailyLimit=12;let d=new Date(APP.report.year,APP.report.month-1+delta,1);APP.month=d.getMonth()+1;APP.year=d.getFullYear();loading('Aylık rapor okunuyor...');try{APP.report=await loadReport(APP.current,APP.month,APP.year,true);saveReportCache(APP.report);checkReportAlert(APP.current,APP.report,true);showDevice(APP.tab)}catch(e){toast(e.message);const c=getReportCache(APP.current.id,APP.month,APP.year);if(c){APP.report=c;showDevice(APP.tab)}else showCompanies()}}
async function reloadCurrent(){await openCompany(encodeURIComponent(APP.current.id))}
function showTableReport(){const r=APP.report;app.innerHTML=`${topBar('Aylık Rapor')}${offlineBar()}<main class="page"><div class="row between"><select class="input" style="width:auto" onchange="jumpMonth(this.value)">${monthOptions(r.month,r.year)}</select><div class="small-actions export-actions"><button class="btn btn-soft btn-sm" onclick="exportExcel()">${icon('excel')} Excel</button><button class="btn btn-soft btn-sm" onclick="exportPdf()">${icon('pdf')} PDF</button></div></div><h2 class="section-title">${esc(r.company.name)}</h2><div class="table-wrap"><table class="data"><thead><tr><th>Tarih</th><th>Max.Dem.</th><th>Aktif (kWh)</th><th>İnd. (kvarh)</th><th>Kap. (kvarh)</th><th>Aktif Fark</th><th>İnd. Oran %</th><th>Kap. Oran %</th></tr></thead><tbody>${r.records.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.max||'')}</td><td>${fmt(x.total,3)}</td><td>${fmt(x.inductive,3)}</td><td>${fmt(x.capacitive,3)}</td><td>${fmt(x.activeDiff,3)}</td><td>${fmt(x.indRatio,1)}</td><td>${fmt(x.capRatio,1)}</td></tr>`).join('')}<tr><td>Sonuç</td><td>—</td><td colspan="4">${r.records.length} kayıt</td><td>${fmt(r.indRatio)}</td><td>${fmt(r.capRatio)}</td></tr></tbody></table></div></main>${bottom('reports')}`}
function monthOptions(m,y){let s='';for(let i=0;i<12;i++)s+=`<option ${i+1===m?'selected':''} value="${i+1}-${y}">${MONTHS[i]} ${y}</option>`;return s}
async function jumpMonth(v){const [m,y]=v.split('-').map(Number);APP.month=m;APP.year=y;await changeMonth(0)}

function checkReportAlert(company,r,popup=false){const exceeded=[];if(r.indRatio>=APP.settings.indLimit)exceeded.push({type:'İndüktif',value:r.indRatio,limit:APP.settings.indLimit});if(r.capRatio>=APP.settings.capLimit)exceeded.push({type:'Kapasitif',value:r.capRatio,limit:APP.settings.capLimit});for(const x of exceeded){const key=`${company.id}_${x.type}_${r.month}_${r.year}`;let a=APP.alerts.find(z=>z.key===key);if(!a){a={key,companyId:company.id,company:company.name,type:x.type,value:x.value,limit:x.limit,time:new Date().toISOString(),active:true};APP.alerts.unshift(a)}else{a.value=x.value;a.active=true;a.time=new Date().toISOString()}}saveAlerts();if(popup&&exceeded.length&&APP.settings.notifications){const x=exceeded[0];modal('Limit Aşımı Uyarısı',`<b>${esc(company.name)}</b><br>${x.type} oranı limit değerini aştı.<br><br>Anlık Değer: <b class="red">%${fmt(x.value)}</b><br>Limit Değeri: <b>%${x.limit}</b>`,`<button class="btn btn-primary btn-block" onclick="closeModal();sendWhatsAppCurrent()">WhatsApp ile Bildir</button><button class="btn btn-soft btn-block" style="margin-top:8px" onclick="closeModal()">Tamam</button>`)}}
function loadAlerts(){try{APP.alerts=JSON.parse(localStorage.getItem('etm_alerts')||'[]')}catch{APP.alerts=[]}}
function saveAlerts(){localStorage.setItem('etm_alerts',JSON.stringify(APP.alerts.slice(0,300)))}
function showAlerts(){const active=APP.alerts.filter(a=>a.active),past=APP.alerts.filter(a=>!a.active);app.innerHTML=`${topBar('Uyarılar',false)}<main class="page"><div class="row between"><h1 class="section-title">Aktif Uyarılar</h1><button class="btn btn-soft btn-sm" onclick="scanAlerts(true)">↻ Kontrol Et</button></div>${active.length?active.map(alertHtml).join(''):'<div class="empty">Aktif uyarı yok.</div>'}${past.length?`<h2 class="section-title">Geçmiş Uyarılar</h2>${past.slice(0,20).map(alertHtml).join('')}`:''}</main>${bottom('home')}`}
function alertHtml(a){const danger=a.value>=a.limit;return `<section class="card alert-item"><span class="alert-icon ${danger?'danger':''}">⚠</span><div><div class="strong">${esc(a.company)}</div><div class="sub">${esc(a.type)} oran limitini aştı</div><div class="sub">${new Date(a.time).toLocaleString('tr-TR')}</div></div><div class="center"><div class="alert-value ${danger?'red':'orange'}">%${fmt(a.value)}</div><button class="btn btn-soft btn-sm" onclick="sendWhatsAppAlert('${encodeURIComponent(a.key)}')">WhatsApp</button></div></section>`}
async function runPool(items,limit,worker,onProgress){let next=0,done=0,failed=0;async function run(){while(true){const idx=next++;if(idx>=items.length)return;try{await worker(items[idx],idx)}catch(e){failed++;console.warn('Veri okunamadı:',e)}done++;if(onProgress)onProgress(done,items.length)}}await Promise.all(Array.from({length:Math.min(limit,items.length)},run));return {done,failed}}
async function scanAlerts(show=true){if(!APP.logged||!APP.companies.length)return;show&&toast('Şirketler kontrol ediliyor...');const result=await runPool(APP.companies,4,async c=>{const r=await loadReport(c,new Date().getMonth()+1,new Date().getFullYear());checkReportAlert(c,r,false)},(done,total)=>{if(show&&(done===total||done%5===0))toast(`${done}/${total} kontrol edildi`)});if(!result.failed)localStorage.setItem('etm_last_scan',new Date().toLocaleString('tr-TR'));show&&toast(result.failed?`${result.failed} şirket okunamadı; senkronizasyon tamamlanmadı.`:'Senkronizasyon tamamlandı.');if(show)showAlerts()}
function startMonitor(){clearInterval(APP.monitorTimer);if(!APP.settings.notifications)return;APP.monitorTimer=setInterval(()=>scanAlerts(false),Math.max(5,APP.settings.interval)*60000)}

function showReports(){showTableOrMonthly()}
function showTableOrMonthly(){if(APP.report)showTableReport();else showMonthlyExceeded()}
function previousMonth(){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);return {month:d.getMonth()+1,year:d.getFullYear()}}
async function showMonthlyExceeded(){const p=previousMonth();const m=APP.month||p.month,y=APP.year||p.year;app.innerHTML=`${topBar('Aylık Limit Aşan Şirketler',false)}<main class="page"><section class="card"><div class="row">${icon('reports')}<select id="monthlyMonth" class="input" style="margin:0" onchange="monthlyMonthChange(this.value)">${monthYearOptions(m,y)}</select></div></section><div class="small-actions export-actions"><button class="btn btn-primary btn-sm" onclick="scanMonthly()">Raporu Hesapla</button><button class="btn btn-soft btn-sm" onclick="exportMonthlyExcel()">${icon('excel')} Excel</button><button class="btn btn-soft btn-sm" onclick="exportMonthlyPdf()">${icon('pdf')} PDF</button></div><div id="monthlyContent">${monthlyContent(APP.monthly,m,y)}</div></main>${bottom('reports')}`}
function monthYearOptions(m,y){let s='';for(let k=0;k<24;k++){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-k);const mm=d.getMonth()+1,yy=d.getFullYear();s+=`<option value="${mm}-${yy}" ${mm===m&&yy===y?'selected':''}>${MONTHS[mm-1]} ${yy}</option>`}return s}
function monthlyMonthChange(v){const [m,y]=v.split('-').map(Number);APP.month=m;APP.year=y;APP.monthly=[];$('#monthlyContent').innerHTML=monthlyContent([],m,y)}
async function scanMonthly(){const [m,y]=($('#monthlyMonth')?.value||`${APP.month}-${APP.year}`).split('-').map(Number);APP.month=m;APP.year=y;const host=$('#monthlyContent');host.innerHTML=`<section class="card"><b>Şirketler senkronize ediliyor...</b><div class="progress"><span id="scanProgress"></span></div><div class="sub" id="scanLabel">0 / ${APP.companies.length}</div></section>`;const out=[];await runPool(APP.companies,4,async c=>{const r=await loadReport(c,m,y);if(r.indRatio>=APP.settings.monthlyInd||r.capRatio>=APP.settings.monthlyCap)out.push({company:c,id:c.id,ind:r.indRatio,cap:r.capRatio,report:r})},(done,total)=>{const p=$('#scanProgress'),l=$('#scanLabel');if(p)p.style.width=(done/total*100)+'%';if(l)l.textContent=`${done} / ${total}`});APP.monthly=out.sort((a,b)=>Math.max(b.ind,b.cap)-Math.max(a.ind,a.cap));localStorage.setItem(`etm_monthly_${m}_${y}`,JSON.stringify(APP.monthly));host.innerHTML=monthlyContent(APP.monthly,m,y);toast('Ay sonu raporu hazırlandı.')}
function monthlyContent(list,m,y){const ind=list.filter(x=>x.ind>=APP.settings.monthlyInd).length,cap=list.filter(x=>x.cap>=APP.settings.monthlyCap).length;return `<div class="summary-cards"><div class="summary-card"><div class="sub">İndüktif ≥ %${APP.settings.monthlyInd}</div><b>${ind}</b><span class="sub"> şirket</span></div><div class="summary-card"><div class="sub">Kapasitif ≥ %${APP.settings.monthlyCap}</div><b>${cap}</b><span class="sub"> şirket</span></div></div><div class="tabs" style="margin-top:12px"><button class="tab active">Tümü</button><button class="tab">İndüktif</button><button class="tab">Kapasitif</button></div><h2 class="section-title">Limit Aşan Şirketler</h2>${list.length?list.map(x=>monthlyItem(x)).join(''):`<div class="empty">${MONTHS[(m||1)-1]} ${y||''} için henüz hesaplama yapılmadı veya limit aşımı bulunmadı.</div>`}<div class="card" style="border:1px solid #cfe0fa;background:#f7fbff"><div class="sub">Bu sayfa, ay sonunda indüktif oranı %${APP.settings.monthlyInd} ve üzeri veya kapasitif oranı %${APP.settings.monthlyCap} ve üzeri olan şirketleri gösterir.</div></div>`}
function monthlyItem(x){const it=x.ind>=APP.settings.monthlyInd,ct=x.cap>=APP.settings.monthlyCap;return `<section class="card alert-item" onclick="openMonthlyCompany('${encodeURIComponent(x.id)}')"><span class="alert-icon danger">!</span><div><div class="strong">${esc(x.company.name)}</div><div class="sub">Sayaç ${esc(x.id)}</div><div>${it?`<span class="pill redp">İndüktif %${fmt(x.ind)}</span>`:''} ${ct?`<span class="pill orangep">Kapasitif %${fmt(x.cap)}</span>`:''}</div></div><span class="chev">›</span></section>`}
function openMonthlyCompany(enc){const id=decodeURIComponent(enc),x=APP.monthly.find(z=>String(z.id)===id);if(!x)return;APP.current=x.company;APP.report=x.report;showDevice('daily')}

function showSettings(){app.innerHTML=`${topBar('Uyarı Ayarları',false)}<main class="page"><h1 class="section-title">Limit Değerleri</h1><section class="card"><div class="setting-row"><label>İndüktif Uyarı Limiti (%)</label><input id="indLimit" class="input" type="number" step="0.1" value="${APP.settings.indLimit}"></div><div class="setting-row"><label>Kapasitif Uyarı Limiti (%)</label><input id="capLimit" class="input" type="number" step="0.1" value="${APP.settings.capLimit}"></div><div class="setting-row"><label>Ay Sonu İndüktif Limiti (%)</label><input id="monthlyInd" class="input" type="number" step="0.1" value="${APP.settings.monthlyInd}"></div><div class="setting-row"><label>Ay Sonu Kapasitif Limiti (%)</label><input id="monthlyCap" class="input" type="number" step="0.1" value="${APP.settings.monthlyCap}"></div></section><h2 class="section-title">Bildirim Ayarları</h2><section class="card"><div class="row between setting-row"><div><b>Uygulama Uyarıları</b><div class="sub">Uygulama açıkken periyodik kontrol</div></div><label class="switch"><input id="notifications" type="checkbox" ${APP.settings.notifications?'checked':''}><span></span></label></div><div class="setting-row"><label>Kontrol Aralığı (dakika)</label><input id="interval" class="input" type="number" min="5" value="${APP.settings.interval}"></div></section><h2 class="section-title">WhatsApp Ayarları</h2><section class="card"><div class="setting-row"><label>Telefon Numarası</label><input id="phone" class="input" inputmode="tel" value="${esc(APP.settings.phone)}" placeholder="+90 555 123 45 67"><div class="sub">Numarayı ülke koduyla yazın.</div></div><div class="row between"><b>WhatsApp Bildirimi</b><label class="switch"><input id="whatsapp" type="checkbox" ${APP.settings.whatsapp?'checked':''}><span></span></label></div></section><h2 class="section-title">Sunucu</h2><section class="card"><label>Site Adresi</label><input id="baseUrl" class="input" value="${esc(APP.base)}"></section><button class="btn btn-primary btn-block" onclick="saveSettingsForm()">Kaydet</button></main>${bottom('settings')}`}
function saveSettingsForm(){const n=id=>Number($('#'+id).value);APP.settings.indLimit=n('indLimit')||15;APP.settings.capLimit=n('capLimit')||10;APP.settings.monthlyInd=n('monthlyInd')||20;APP.settings.monthlyCap=n('monthlyCap')||15;APP.settings.interval=Math.max(5,n('interval')||15);APP.settings.phone=$('#phone').value.trim();APP.settings.notifications=$('#notifications').checked;APP.settings.whatsapp=$('#whatsapp').checked;APP.base=$('#baseUrl').value.trim().replace(/\/$/,'')||APP.base;saveSettings();startMonitor();toast('Ayarlar kaydedildi.')}
function showAbout(){app.innerHTML=`${topBar('Hakkında',false)}<main class="page"><img src="ets_logo.png" class="ets-logo about-logo-img" alt="ETS"><div class="center strong" style="font-size:20px">Enerji Takip Sistemi</div><section class="card" style="margin-top:23px"><h3>Uygulama Hakkında</h3><p class="sub" style="font-size:14px">Bu uygulama ETM Elektrik & Mühendislik tarafından enerji sayaçlarını mobil ortamda izlemek, aylık tüketimleri analiz etmek ve reaktif oran limitlerini takip etmek amacıyla hazırlanmıştır.</p><hr style="border:0;border-top:1px solid #eee"><div class="row between"><span>Sürüm</span><b>1.0.16</b></div><div class="row between" style="margin-top:12px"><span>Web Sitesi</span><b>www.etm.com.tr</b></div><div class="row between" style="margin-top:12px"><span>Yıl</span><b>2026</b></div></section><div class="center sub">Uygulama ETM Mühendislik tarafından hazırlanmıştır.</div><div class="credit">IZADEEN N A SAWAFIRI<br>2026</div></main>${bottom('settings')}`}

function whatsappMessage(company,type,value,limit){return `ETS Enerji Takip Uyarısı\nŞirket: ${company}\n${type} oranı limit değerini aştı.\nAnlık Değer: %${fmt(value)}\nLimit Değeri: %${limit}\nTarih: ${new Date().toLocaleString('tr-TR')}`}
function openWhatsApp(message){if(!APP.settings.whatsapp){toast('WhatsApp bildirimleri ayarlardan kapalı.');return}const phone=(APP.settings.phone||'').replace(/\D/g,'');if(!phone){toast('Ayarlar bölümünden WhatsApp numarası giriniz.');showSettings();return}location.href=`https://wa.me/${phone}?text=${encodeURIComponent(message)}`}
function sendWhatsAppCurrent(){const r=APP.report;if(!r)return;const type=r.indRatio>=APP.settings.indLimit?'İndüktif':'Kapasitif',value=type==='İndüktif'?r.indRatio:r.capRatio,limit=type==='İndüktif'?APP.settings.indLimit:APP.settings.capLimit;openWhatsApp(whatsappMessage(r.company.name,type,value,limit))}
function sendWhatsAppAlert(enc){const key=decodeURIComponent(enc),a=APP.alerts.find(x=>x.key===key);if(a)openWhatsApp(whatsappMessage(a.company,a.type,a.value,a.limit))}
async function shareText(title,text){try{if(navigator.share){await navigator.share({title,text});return}if(navigator.clipboard){await navigator.clipboard.writeText(text);toast('Rapor panoya kopyalandı.');return}}catch{}modal(title,`<textarea class="input" style="height:220px">${esc(text)}</textarea>`)}

function csvForReport(r){const rows=[['Tarih','Max Demand','Toplam kWh','İndüktif kvarh','Kapasitif kvarh','Toplam Fark','İndüktif Fark','Kapasitif Fark','İndüktif Oran %','Kapasitif Oran %'],...r.records.map(x=>[x.date,x.max,x.total,x.inductive,x.capacitive,x.activeDiff,x.indDiff,x.capDiff,x.indRatio,x.capRatio])];return rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\n')}


function safeFileName(s){return norm(s).replace(/\s+/g,'_').replace(/[^A-Z0-9_-]/g,'').slice(0,60)||'ETS_RAPOR'}
async function deliverFile(name,mime,blob){try{const file=new File([blob],name,{type:mime});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}}catch(e){}try{const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.style.display='none';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},2500);toast(name+' oluşturuldu.')}catch(e){toast('Dosya oluşturulamadı: '+e.message)}}
function xmlEsc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]))}
function excelCell(v,style=''){const n=typeof v==='number'&&Number.isFinite(v);return `<Cell${style?` ss:StyleID="${style}"`:''}><Data ss:Type="${n?'Number':'String'}">${xmlEsc(n?v:String(v??''))}</Data></Cell>`}
function reportRows(r){return r.records.map(x=>[x.date,x.max||'',x.total,x.inductive,x.capacitive,x.activeDiff,x.indDiff,x.capDiff,x.indRatio,x.capRatio])}
function spreadsheetXml(title,meta,headers,rows){const metaRows=meta.map(x=>`<Row>${excelCell(x[0],'label')}${excelCell(x[1])}</Row>`).join('');const dataRows=rows.map(row=>`<Row>${row.map(v=>excelCell(v)).join('')}</Row>`).join('');return `<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Styles><Style ss:ID="Default"><Alignment ss:Vertical="Center"/><Font ss:FontName="Arial" ss:Size="10"/></Style><Style ss:ID="title"><Font ss:Bold="1" ss:Size="16" ss:Color="#172033"/></Style><Style ss:ID="label"><Font ss:Bold="1"/></Style><Style ss:ID="head"><Font ss:Bold="1" ss:Color="#FFFFFF"/><Interior ss:Color="#172033" ss:Pattern="Solid"/></Style></Styles><Worksheet ss:Name="${xmlEsc(title.slice(0,31))}"><Table><Column ss:AutoFitWidth="1" ss:Width="115"/><Column ss:AutoFitWidth="1" ss:Width="100"/><Row><Cell ss:StyleID="title" ss:MergeAcross="${Math.max(1,headers.length-1)}"><Data ss:Type="String">${xmlEsc(title)}</Data></Cell></Row>${metaRows}<Row>${headers.map(h=>excelCell(h,'head')).join('')}</Row>${dataRows}</Table></Worksheet></Workbook>`}
async function exportExcel(){const r=APP.report;if(!r)return toast('Önce bir şirket raporu açın.');const meta=[['Şirket',r.company.name],['Firma ID',r.company.id],['Dönem',`${MONTHS[r.month-1]} ${r.year}`],['Aktif Enerji (kWh)',r.current.kwh],['İndüktif (kvarh)',r.current.indKvarh],['Kapasitif (kvarh)',r.current.capKvarh],['İndüktif Oran (%)',r.indRatio],['Kapasitif Oran (%)',r.capRatio],['L1/L2/L3 Gerilim (V)',r.current.v.map(x=>fmt(x,2)).join(' / ')],['L1/L2/L3 Akım (A)',r.current.a.map(x=>fmt(x,2)).join(' / ')]];const headers=['Tarih','Max Demand','Toplam kWh','İndüktif kvarh','Kapasitif kvarh','Aktif Fark','İndüktif Fark','Kapasitif Fark','İndüktif Oran %','Kapasitif Oran %'];const xml=spreadsheetXml('ETS Enerji Raporu',meta,headers,reportRows(r));await deliverFile(`ETS_${safeFileName(r.company.name)}_${r.month}_${r.year}.xls`,'application/vnd.ms-excel',new Blob(['\ufeff',xml],{type:'application/vnd.ms-excel;charset=utf-8'}))}
async function exportMonthlyExcel(){const meta=[['Dönem',`${MONTHS[APP.month-1]} ${APP.year}`],['İndüktif Limit (%)',APP.settings.monthlyInd],['Kapasitif Limit (%)',APP.settings.monthlyCap],['Şirket Sayısı',APP.monthly.length]];const rows=APP.monthly.map(x=>[x.company.name,x.id,x.report?.imei||'',x.ind,x.cap]);const xml=spreadsheetXml('Aylık Limit Aşanlar',meta,['Şirket','Sayaç','IMEI','İndüktif Oran %','Kapasitif Oran %'],rows);await deliverFile(`ETS_Aylik_Limit_${APP.month}_${APP.year}.xls`,'application/vnd.ms-excel',new Blob(['\ufeff',xml],{type:'application/vnd.ms-excel;charset=utf-8'}))}
function dataUrlBytes(url){const b=atob(url.split(',')[1]),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function makePdfFromJpegs(images){const te=new TextEncoder(),chunks=[],offsets=[0];let total=0;const push=x=>{const b=typeof x==='string'?te.encode(x):x;chunks.push(b);total+=b.length};push('%PDF-1.4\n%\xFF\xFF\xFF\xFF\n');const count=images.length;const objCount=2+count*3;function obj(n,parts){offsets[n]=total;push(`${n} 0 obj\n`);for(const p of parts)push(p);push('\nendobj\n')}obj(1,[`<< /Type /Catalog /Pages 2 0 R >>`]);const kids=images.map((_,i)=>`${3+i*3} 0 R`).join(' ');obj(2,[`<< /Type /Pages /Kids [${kids}] /Count ${count} >>`]);images.forEach((im,i)=>{const page=3+i*3,img=page+1,content=page+2;obj(page,[`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im0 ${img} 0 R >> >> /Contents ${content} 0 R >>`]);obj(img,[`<< /Type /XObject /Subtype /Image /Width ${im.width} /Height ${im.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bytes.length} >>\nstream\n`,im.bytes,'\nendstream']);const stream='q\n595 0 0 842 0 0 cm\n/Im0 Do\nQ\n';obj(content,[`<< /Length ${te.encode(stream).length} >>\nstream\n${stream}endstream`])});const xref=total;push(`xref\n0 ${objCount+1}\n0000000000 65535 f \n`);for(let n=1;n<=objCount;n++)push(String(offsets[n]).padStart(10,'0')+' 00000 n \n');push(`trailer\n<< /Size ${objCount+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);const out=new Uint8Array(total);let pos=0;for(const c of chunks){out.set(c,pos);pos+=c.length}return new Blob([out],{type:'application/pdf'})}
function drawPdfHeader(ctx,title,subtitle,pageNo,total){ctx.fillStyle='#ffffff';ctx.fillRect(0,0,1240,1754);ctx.fillStyle='#172033';ctx.fillRect(0,0,1240,155);ctx.fillStyle='#ffffff';ctx.font='bold 54px Arial';ctx.fillText('ETS',70,95);ctx.font='bold 30px Arial';ctx.fillText(title,210,72);ctx.font='20px Arial';ctx.fillStyle='#c9d2df';ctx.fillText(subtitle,210,108);ctx.textAlign='right';ctx.fillText(`${pageNo}/${total}`,1170,95);ctx.textAlign='left'}
function reportPdfImages(r){const rows=reportRows(r),per=22,total=Math.max(1,Math.ceil(rows.length/per));const images=[];for(let p=0;p<total;p++){const c=document.createElement('canvas');c.width=1240;c.height=1754;const x=c.getContext('2d');drawPdfHeader(x,'Enerji Raporu',`${r.company.name} • ${MONTHS[r.month-1]} ${r.year}`,p+1,total);let y=205;if(p===0){x.fillStyle='#202734';x.font='bold 25px Arial';x.fillText('Rapor Bilgileri',70,y);y+=42;x.font='21px Arial';const info=[`Şirket: ${r.company.name}`,`Firma ID: ${r.company.id}`,`Dönem: ${MONTHS[r.month-1]} ${r.year}`, `Aktif enerji: ${fmt(r.current.kwh,3)} kWh`, `İndüktif / Kapasitif: ${fmt(r.current.indKvarh,3)} / ${fmt(r.current.capKvarh,3)} kvarh`,`Oranlar: İndüktif %${fmt(r.indRatio)} • Kapasitif %${fmt(r.capRatio)}`,`Gerilim L1/L2/L3: ${r.current.v.map(v=>fmt(v,1)).join(' / ')} V`,`Akım L1/L2/L3: ${r.current.a.map(v=>fmt(v,1)).join(' / ')} A`];for(const s of info){x.fillText(s,70,y);y+=34}y+=24}x.fillStyle='#172033';x.fillRect(55,y,1130,48);x.fillStyle='#fff';x.font='bold 17px Arial';const heads=['Tarih','Aktif kWh','İnd. kvarh','Kap. kvarh','Aktif Fark','İnd. %','Kap. %'];const cols=[70,280,465,650,835,1010,1100];heads.forEach((h,j)=>x.fillText(h,cols[j],y+31));y+=48;x.font='17px Arial';const pageRows=rows.slice(p*per,(p+1)*per);for(let i=0;i<pageRows.length;i++){const rr=pageRows[i];x.fillStyle=i%2?'#f3f5f8':'#ffffff';x.fillRect(55,y,1130,49);x.fillStyle='#202734';const vals=[rr[0],fmt(rr[2],2),fmt(rr[3],2),fmt(rr[4],2),fmt(rr[5],2),fmt(rr[8],1),fmt(rr[9],1)];vals.forEach((v,j)=>x.fillText(String(v??''),cols[j],y+31));y+=49}x.fillStyle='#747b89';x.font='16px Arial';x.fillText(`Oluşturma: ${new Date().toLocaleString('tr-TR')} • ETS Enerji Takip v2.0.0`,70,1695);images.push({bytes:dataUrlBytes(c.toDataURL('image/jpeg',.9)),width:c.width,height:c.height})}return images}
async function exportPdf(){const r=APP.report;if(!r)return toast('Önce bir şirket raporu açın.');toast('PDF hazırlanıyor...');await new Promise(resolve=>setTimeout(resolve,50));const blob=makePdfFromJpegs(reportPdfImages(r));await deliverFile(`ETS_${safeFileName(r.company.name)}_${r.month}_${r.year}.pdf`,'application/pdf',blob)}
function monthlyPdfImages(){const rows=APP.monthly,per=25,total=Math.max(1,Math.ceil(rows.length/per));const images=[];for(let p=0;p<total;p++){const c=document.createElement('canvas');c.width=1240;c.height=1754;const x=c.getContext('2d');drawPdfHeader(x,'Aylık Limit Aşanlar',`${MONTHS[APP.month-1]} ${APP.year}`,p+1,total);let y=220;x.fillStyle='#202734';x.font='22px Arial';x.fillText(`İndüktif limit: %${APP.settings.monthlyInd}   •   Kapasitif limit: %${APP.settings.monthlyCap}   •   Toplam: ${rows.length} şirket`,70,y);y+=50;x.fillStyle='#172033';x.fillRect(55,y,1130,52);x.fillStyle='#fff';x.font='bold 18px Arial';['Şirket','Sayaç','IMEI','İndüktif %','Kapasitif %'].forEach((h,j)=>x.fillText(h,[70,650,800,1010,1110][j],y+34));y+=52;x.font='18px Arial';rows.slice(p*per,(p+1)*per).forEach((r,i)=>{x.fillStyle=i%2?'#f3f5f8':'#fff';x.fillRect(55,y,1130,52);x.fillStyle='#202734';const name=r.company.name.length>43?r.company.name.slice(0,40)+'...':r.company.name;[name,r.id,r.report?.imei||'—',fmt(r.ind),fmt(r.cap)].forEach((v,j)=>x.fillText(String(v),[70,650,800,1010,1110][j],y+34));y+=52});x.fillStyle='#747b89';x.font='16px Arial';x.fillText(`Oluşturma: ${new Date().toLocaleString('tr-TR')} • ETS Enerji Takip v2.0.0`,70,1695);images.push({bytes:dataUrlBytes(c.toDataURL('image/jpeg',.9)),width:c.width,height:c.height})}return images}
async function exportMonthlyPdf(){toast('PDF hazırlanıyor...');await new Promise(resolve=>setTimeout(resolve,50));await deliverFile(`ETS_Aylik_Limit_${APP.month}_${APP.year}.pdf`,'application/pdf',makePdfFromJpegs(monthlyPdfImages()))}
