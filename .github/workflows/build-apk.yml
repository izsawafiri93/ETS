name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Locate Android Gradle project
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          echo "Repository files (first four levels):"
          find "$GITHUB_WORKSPACE" -maxdepth 4 -type f | sort

          SETTINGS_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 5 -type f \
            \( -name settings.gradle -o -name settings.gradle.kts -o -name settings.gradle.dcl \) \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::No settings.gradle file was found. Upload the extracted Android project files, not only the ZIP or workflow file."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          APK_PATH="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          echo "Gradle project found at: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: gradle -p "${{ steps.locate.outputs.project_dir }}" :app:assembleDebug --stacktrace

      - name: Verify generated APK
        shell: bash
        run: |
          set -euo pipefail
          APK="${{ steps.locate.outputs.apk_path }}"
          test -f "$APK"
          unzip -l "$APK" | grep -q "classes.dex"
          echo "Valid APK generated: $APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ETS-Enerji-Takip-APK-v2.0.3
          path: ${{ steps.locate.outputs.apk_path }}
          if-no-files-found: error
